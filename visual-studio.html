<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANTENEH AI STUDIO</title><style>body{margin:0;background:#050a12;color:#eef7ff;font:15px system-ui;padding:18px}main{max-width:1000px;margin:auto}.panel{background:#0b1622;border:1px solid #23405a;border-radius:18px;padding:18px;margin:15px 0}textarea,select,button{font:inherit}textarea,select{width:100%;box-sizing:border-box;background:#07111c;color:#fff;border:1px solid #29435c;border-radius:10px;padding:11px}textarea{min-height:130px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}button{padding:12px 16px;border:0;border-radius:10px;background:#17314a;color:#fff;font-weight:800;cursor:pointer}button.primary{background:#7657ed}button:disabled{opacity:.5;cursor:wait}canvas{width:100%;height:auto;display:block;background:#02060b;border-radius:14px;margin-top:15px}.status{color:#9eb5c8;margin-top:10px;font-weight:700}.bar{height:9px;background:#162739;border-radius:8px;margin-top:8px;overflow:hidden}.fill{height:100%;width:0;background:#46d9ef;transition:width .08s linear}.watch{margin-top:15px;background:#02060b;border-radius:14px;overflow:hidden;border:1px solid #20364a}.watch video{width:100%;display:block;background:#000;max-height:620px}.watch .watch-title{padding:10px 12px;color:#9eb5c8;font-weight:700}.scene{margin:10px 0;padding:12px;border:1px solid #20364a;border-radius:12px;background:#07111c}.scene b{color:#62e6ff}.scene small{display:block;color:#7f9aad;margin-top:4px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}.actions button{width:100%}}</style></head><body><main><h1>✦ ANTENEH AI STUDIO</h1><p>Any subject → visual educational video. Local generation • no API key.</p><section class="panel"><textarea id="topic" placeholder="Enter any topic or full lesson script..."></textarea><div class="grid"><label>Length<select id="length"><option value="60">60 seconds</option><option value="90" selected>90 seconds</option><option value="120">2 minutes</option><option value="300">5 minutes</option></select></label><label>Style<select id="style"><option>Clean explainer</option><option>Whiteboard</option><option>Modern presentation</option><option>Minimal motion graphics</option></select></label><label>Ratio<select id="ratio"><option>16:9</option><option>9:16</option><option>1:1</option><option>4:5</option><option>21:9</option></select></label><label>Visual intelligence<select id="mode"><option>Auto</option><option>Diagram focused</option><option>Process focused</option><option>Presentation focused</option></select></label></div><div class="actions"><button class="primary" id="generate">Generate Video ▶</button><button id="preview">Preview Storyboard</button><button id="save">Save</button><button id="restore">Restore</button></div><div id="status" class="status">Ready.</div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="panel"><canvas id="canvas"></canvas><div id="watch" class="watch" hidden><div class="watch-title">▶ Watch your generated video before downloading</div><video id="videoPreview" controls playsinline preload="metadata"></video></div><a id="download" hidden style="display:inline-block;margin-top:12px;background:white;color:#06101a;padding:11px 15px;border-radius:9px;font-weight:800">Download video</a><div id="scenes"></div></section></main><script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),topic=$("topic"),len=$("length"),style=$("style"),ratio=$("ratio"),mode=$("mode"),gen=$("generate"),prev=$("preview"),save=$("save"),restore=$("restore"),status=$("status"),fill=$("fill"),c=$("canvas"),x=c.getContext("2d"),dl=$("download"),list=$("scenes"),watch=$("watch"),video=$("videoPreview");
let scenes=[],busy=false,raf=0,objectUrl="";const FPS=12;
const stopWords=new Set("a an the and or but for from with into onto about above below this that these those is are was were be been being to of in on at by as it its their they them he she we you your our can could should would will may might do does did how what why when where which who than then also very more most some many much each other another between through during after before because while if so such not no yes have has had".split(/\s+/));
const palette=["#4dd7ff","#a78bfa","#62e6a7","#ffcf66","#ff7f9b"];
function size(){return ({"16:9":[1280,720],"9:16":[720,1280],"1:1":[1080,1080],"4:5":[864,1080],"21:9":[1260,540]})[ratio.value]||[1280,720]}
function clean(s){return String(s||"").replace(/https?:\/\/\S+/g," ").replace(/[^\p{L}\p{N}%+→=<>/'’-]/gu," ").replace(/\s+/g," ").trim()}
function tokens(s){return clean(s).split(/\s+/).filter(w=>w.length>2&&!stopWords.has(w.toLowerCase().replace(/[^a-z]/g,"")))}
function unique(a){return [...new Set(a.map(v=>String(v).replace(/^[^\p{L}\p{N}%]+|[^\p{L}\p{N}%]+$/gu,"")).filter(Boolean))]}
function keywords(s,n=6){return unique(tokens(s)).slice(0,n)}
function splitLesson(t){let p=String(t).trim().split(/(?<=[.!?])\s+|\n+/).map(s=>s.trim()).filter(Boolean);if(p.length<3){let b=String(t).trim().replace(/[?.!]$/,'');p=[`What is ${b}?`,`How does ${b} work?`,`What are the main ideas of ${b}?`,`Why does ${b} matter?`,`An example of ${b}.`,`Key takeaway: ${b}.`]}return p}
function classify(text,i,total){let q=text.toLowerCase();if(/[=→+%]/.test(text)||/formula|equation|calculate|equals/.test(q))return"formula";if(/compare|versus|\bvs\b|difference|similar|unlike|both|whereas/.test(q))return"comparison";if(/first|then|next|finally|step|process|procedure|cycle|how .*\bwork\b/.test(q))return"process";if(/cause|because|therefore|leads to|results? in|effect|why /.test(q))return"cause";if(/example|for instance|such as|e\.g\./.test(q))return"example";if(/warning|avoid|mistake|misconception|danger|careful|risk/.test(q))return"warning";if(/timeline|history|year|century|before|after|era|founded|born/.test(q))return"timeline";if(i===0)return"concept";if(i===total-1)return"recap";return"concept"}
function make(t){let p=splitLesson(t),max=+len.value<=60?6:+len.value<=90?7:+len.value<=120?8:12;p=p.slice(0,max);return p.map((text,i)=>{let k=keywords(text,8);return{id:i,title:i===0?"The big question":i===p.length-1?"Key takeaway":k[0]?k[0].replace(/^[a-z]/,m=>m.toUpperCase()):`Key idea ${i+1}`,text,type:classify(text,i,p.length),keywords:k}})}
function fit(text,w,max=3,base=44){let fs=Math.max(18,Math.min(base,w/28)),lines=[],line="";x.font=`700 ${fs}px system-ui`;for(const word of String(text).split(/\s+/)){let n=line?line+" "+word:word;if(x.measureText(n).width>w*.8&&line){lines.push(line);line=word;if(lines.length===max)break}else line=n}if(line&&lines.length<max)lines.push(line);return{lines,fs}}
function roundRect(px,py,pw,ph,r){x.beginPath();if(x.roundRect)x.roundRect(px,py,pw,ph,r);else{x.moveTo(px+r,py);x.arcTo(px+pw,py,px+pw,py+ph,r);x.arcTo(px+pw,py+ph,px,py+ph,r);x.arcTo(px,py+ph,px,py,r);x.arcTo(px,py,px+pw,py,r)}x.closePath()}
function card(px,py,pw,ph,text,accent,scale=1){x.fillStyle="rgba(8,24,38,.94)";x.strokeStyle=accent;x.lineWidth=3;roundRect(px,py,pw,ph,18);x.fill();x.stroke();let z=fit(text,pw,2,Math.max(26,Math.min(46,pw/10)));x.fillStyle="#fff";x.font=`800 ${z.fs*scale}px system-ui`;x.textAlign="center";z.lines.forEach((l,j)=>x.fillText(l,px+pw/2,py+ph/2+(j-(z.lines.length-1)/2)*z.fs*1.2));x.textAlign="left"}
function arrow(x1,y1,x2,y2,accent){x.strokeStyle=accent;x.fillStyle=accent;x.lineWidth=6;x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();let a=Math.atan2(y2-y1,x2-x1);x.beginPath();x.moveTo(x2,y2);x.lineTo(x2-20*Math.cos(a-.55),y2-20*Math.sin(a-.55));x.lineTo(x2-20*Math.cos(a+.55),y2-20*Math.sin(a+.55));x.closePath();x.fill()}
function background(w,h){x.fillStyle="#06111c";x.fillRect(0,0,w,h);let g=x.createRadialGradient(w*.72,h*.18,0,w*.72,h*.18,Math.max(w,h)*.72);g.addColorStop(0,"#102d45");g.addColorStop(1,"#06111c");x.fillStyle=g;x.fillRect(0,0,w,h);x.strokeStyle="rgba(120,210,255,.07)";x.lineWidth=1;for(let i=0;i<w;i+=60){x.beginPath();x.moveTo(i,0);x.lineTo(i,h);x.stroke()}for(let i=0;i<h;i+=60){x.beginPath();x.moveTo(0,i);x.lineTo(w,i);x.stroke()}}
function header(s,w,h){x.fillStyle="#62e6ff";x.font=`900 ${Math.max(24,w/30)}px system-ui`;x.fillText(s.title,w*.06,h*.10);x.fillStyle="#91aabd";x.font=`700 ${Math.max(12,w/90)}px system-ui`;x.fillText(`${s.type.toUpperCase()} • SCENE ${s.id+1}`,w*.06,h*.155)}
function drawConcept(s,t){let w=c.width,h=c.height,ks=s.keywords.length?s.keywords:[s.title],a=palette[s.id%palette.length],cx=w/2,cy=h*.53;card(w*.30,h*.35,w*.40,h*.22,ks[0]||s.title,a,1.08);let others=ks.slice(1,5),r=Math.min(w,h)*.27;others.forEach((k,i)=>{let ang=-Math.PI*.85+i*Math.PI*1.7/Math.max(1,others.length-1),px=cx+Math.cos(ang)*r,py=cy+Math.sin(ang)*r*.72;card(px-w*.09,py-h*.07,w*.18,h*.14,k,palette[(i+1)%palette.length],.78);arrow(px+(cx>px?10:-10),py+(cy>py?8:-8),cx+(px<cx?-r*.45:r*.45),cy+(py<cy?-r*.35:r*.35),palette[(i+1)%palette.length])});x.fillStyle="#fff";x.font=`700 ${Math.max(17,w/60)}px system-ui`;x.textAlign="center";x.fillText("CONCEPT • CONNECTED IDEAS",cx,h*.82);x.textAlign="left"}
function drawProcess(s,t){let w=c.width,h=c.height,ks=s.keywords.slice(0,5);if(!ks.length)ks=[s.title];let n=ks.length,gap=w*.025,box=(w*.82-gap*(n-1))/n,y=h*.39;ks.forEach((k,i)=>{let xx=w*.09+i*(box+gap),yy=y+Math.sin(t/350+i)*7;card(xx,yy,box,h*.21,k,palette[i%palette.length],.88);if(i<n-1)arrow(xx+box+4,yy+h*.105,xx+box+gap-4,y+h*.105,"#fff")});x.fillStyle="#fff";x.font=`800 ${Math.max(17,w/58)}px system-ui`;x.textAlign="center";x.fillText("SEQUENCE / PROCESS",w/2,h*.78);x.textAlign="left"}
function drawComparison(s){let w=c.width,h=c.height,ks=s.keywords.length?s.keywords:["A","B"],mid=w/2;card(w*.07,h*.36,w*.36,h*.27,ks[0],palette[s.id%5],1);card(w*.57,h*.36,w*.36,h*.27,ks[1]||"B",palette[(s.id+1)%5],1);arrow(w*.43,h*.50,w*.56,h*.50,"#fff");x.fillStyle="#a9bfd0";x.font=`800 ${Math.max(15,w/65)}px system-ui`;x.textAlign="center";x.fillText("COMPARE • CONTRAST • UNDERSTAND",mid,h*.78);x.textAlign="left"}
function drawCause(s){let w=c.width,h=c.height,ks=s.keywords.length?s.keywords:["Cause","Effect"];card(w*.08,h*.36,w*.32,h*.25,ks[0],palette[s.id%5]);card(w*.60,h*.36,w*.32,h*.25,ks[1]||"Effect",palette[(s.id+1)%5]);arrow(w*.40,h*.485,w*.59,h*.485,"#fff");x.fillStyle="#fff";x.font=`900 ${Math.max(17,w/58)}px system-ui`;x.textAlign="center";x.fillText("WHY → RESULT",w/2,h*.76);x.textAlign="left"}
function drawFormula(s,t){let w=c.width,h=c.height,parts=unique((s.text.match(/[\p{L}\p{N}%]+|→|=|\+/gu)||s.keywords)).slice(0,7);if(!parts.length)parts=[s.title];let gap=w*.018,box=(w*.82-gap*(parts.length-1))/parts.length,y=h*.39;parts.forEach((p,i)=>{let xx=w*.09+i*(box+gap);card(xx,y,box,h*.21,p,palette[i%5],1+.04*Math.sin(t/250+i));if(i<parts.length-1)arrow(xx+box+3,y+h*.105,xx+box+gap-3,y+h*.105,"#fff")});x.fillStyle="#a9bfd0";x.font=`800 ${Math.max(15,w/65)}px system-ui`;x.textAlign="center";x.fillText("RELATIONSHIP / EQUATION",w/2,h*.78);x.textAlign="left"}
function drawTimeline(s,t){let w=c.width,h=c.height,ks=s.keywords.slice(0,6);if(!ks.length)ks=[s.title];let y=h*.52,x0=w*.10,x1=w*.90;x.strokeStyle=palette[s.id%5];x.lineWidth=8;x.beginPath();x.moveTo(x0,y);x.lineTo(x1,y);x.stroke();ks.forEach((k,i)=>{let xx=x0+(x1-x0)*(i/Math.max(1,ks.length-1));x.fillStyle=palette[i%5];x.beginPath();x.arc(xx,y,14+6*Math.sin(t/280+i),0,Math.PI*2);x.fill();card(Math.max(8,xx-w*.08),y-h*.25,w*.16,h*.16,k,palette[i%5],.7)})}
function drawExample(s,warning){let w=c.width,h=c.height,a=warning?"#ff7f9b":palette[s.id%5],title=warning?"WATCH FOR THIS":"REAL EXAMPLE";x.fillStyle=a;x.font=`900 ${Math.max(19,w/48)}px system-ui`;x.fillText(title,w*.08,h*.31);let z=fit(s.text,w*.78,5,Math.max(24,w/32));x.fillStyle="#fff";x.font=`700 ${z.fs}px system-ui`;z.lines.forEach((l,i)=>x.fillText(l,w*.08,h*.42+i*z.fs*1.35));x.strokeStyle=a;x.lineWidth=6;x.beginPath();x.arc(w*.82,h*.68,Math.min(w,h)*.09*(1+.06*Math.sin(performance.now()/220)),0,Math.PI*2);x.stroke();x.fillStyle=a;x.font=`900 ${Math.max(24,w/45)}px system-ui`;x.textAlign="center";x.fillText(warning?"!":"✓",w*.82,h*.68+9);x.textAlign="left"}
function drawRecap(s,t){let w=c.width,h=c.height,ks=s.keywords.slice(0,6),cx=w/2,cy=h*.53,r=Math.min(w,h)*.22;ks.forEach((k,i)=>{let ang=i/Math.max(1,ks.length)*Math.PI*2+t/500,px=cx+Math.cos(ang)*r*1.5,py=cy+Math.sin(ang)*r;card(px-w*.09,py-h*.07,w*.18,h*.14,k,palette[i%5],.72);arrow(px+(cx>px?12:-12),py+(cy>py?10:-10),cx+(px<cx?-r:r)*.5,cy+(py<cy?-r:r)*.3,palette[i%5])});x.fillStyle="#fff";x.font=`900 ${Math.max(20,w/50)}px system-ui`;x.textAlign="center";x.fillText("KEY IDEAS",cx,cy+8);x.textAlign="left"}
function render(s,t){let w=c.width,h=c.height;background(w,h);header(s,w,h);switch(s.type){case"process":drawProcess(s,t);break;case"comparison":drawComparison(s);break;case"cause":drawCause(s);break;case"formula":drawFormula(s,t);break;case"timeline":drawTimeline(s,t);break;case"example":drawExample(s,false);break;case"warning":drawExample(s,true);break;case"recap":drawRecap(s,t);break;default:drawConcept(s,t)}}
function setup(){let text=topic.value.trim();if(!text){status.textContent="Please enter a topic or script.";return false}let d=size();c.width=d[0];c.height=d[1];scenes=make(text);list.innerHTML=scenes.map((s,i)=>`<div class="scene"><b>${i+1}. ${escapeHtml(s.title)}</b><small>${s.type} — ${escapeHtml(s.text)}</small></div>`).join("");fill.style.width="0%";render(scenes[0],0);return true}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]))}
function stopAnim(){if(raf){cancelAnimationFrame(raf);raf=0}}
function animate(total,onDone,label){stopAnim();let start=performance.now();function frame(now){let elapsed=now-start,p=Math.min(1,elapsed/total),idx=Math.min(scenes.length-1,Math.floor(p*scenes.length));render(scenes[idx],now);fill.style.width=(p*100).toFixed(1)+"%";status.textContent=`${label} ${Math.floor(p*100)}%`;if(p<1)raf=requestAnimationFrame(frame);else{render(scenes[scenes.length-1],now);fill.style.width="100%";onDone()}}raf=requestAnimationFrame(frame)}
function setBusy(v){busy=v;gen.disabled=v;prev.disabled=v;save.disabled=v;restore.disabled=v}
prev.onclick=()=>{if(busy||!setup())return;setBusy(true);animate(Math.min(15000,+len.value*1000),()=>{setBusy(false);status.textContent="Preview complete."},"Preview")};
gen.onclick=()=>{if(busy||!setup())return;if(typeof c.captureStream!=="function"||typeof MediaRecorder!=="function"){status.textContent="This browser cannot export canvas video. Please use current Chrome or Edge.";return}setBusy(true);dl.hidden=true;watch.hidden=true;fill.style.width="0%";let stream;try{stream=c.captureStream(FPS)}catch(e){setBusy(false);status.textContent="Could not start video capture in this browser.";return}let mime="";for(const m of ["video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"]){if(MediaRecorder.isTypeSupported(m)){mime=m;break}}if(!mime){setBusy(false);status.textContent="No supported WebM video format was found.";stream.getTracks().forEach(t=>t.stop());return}let rec;try{rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:1800000})}catch(e){try{rec=new MediaRecorder(stream)}catch(err){setBusy(false);stream.getTracks().forEach(t=>t.stop());status.textContent="Video recorder could not start.";return}}let chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};rec.onerror=()=>{stopAnim();stream.getTracks().forEach(t=>t.stop());setBusy(false);status.textContent="Video recording failed. Try current Chrome or Edge."};rec.onstop=()=>{stopAnim();stream.getTracks().forEach(t=>t.stop());if(!chunks.length){setBusy(false);status.textContent="No video data was produced.";return}if(objectUrl)URL.revokeObjectURL(objectUrl);let blob=new Blob(chunks,{type:mime});objectUrl=URL.createObjectURL(blob);video.src=objectUrl;video.load();watch.hidden=false;dl.href=objectUrl;dl.download="anteneh-ai-studio-video.webm";dl.hidden=false;setBusy(false);fill.style.width="100%";status.textContent="Video ready — watch it above, then download."};rec.start(250);animate(+len.value*1000,()=>{setTimeout(()=>{if(rec.state!=="inactive")rec.stop()},150)},"Generating video")};
save.onclick=()=>{try{localStorage.setItem("anteneh-ai-studio-project",JSON.stringify({topic:topic.value,length:len.value,style:style.value,ratio:ratio.value,mode:mode.value,scenes}));status.textContent="Project saved on this device."}catch(e){status.textContent="Could not save this project on this device."}};
restore.onclick=()=>{try{let p=JSON.parse(localStorage.getItem("anteneh-ai-studio-project")||"null");if(!p){status.textContent="No saved project found.";return}topic.value=p.topic||"";len.value=p.length||"90";style.value=p.style||style.value;ratio.value=p.ratio||ratio.value;mode.value=p.mode||mode.value;setup();status.textContent="Project restored."}catch(e){status.textContent="Could not restore saved project."}};
ratio.onchange=()=>{if(topic.value.trim())setup()};
window.addEventListener("beforeunload",()=>{if(objectUrl)URL.revokeObjectURL(objectUrl);stopAnim()});
setup();
})();</script></body></html>
