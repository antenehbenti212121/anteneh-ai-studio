<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANTENEH AI STUDIO</title><style>body{margin:0;background:#050a12;color:#eef7ff;font:15px system-ui;padding:18px}main{max-width:1000px;margin:auto}.panel{background:#0b1622;border:1px solid #23405a;border-radius:18px;padding:18px;margin:15px 0}textarea,select,button{font:inherit}textarea,select{width:100%;box-sizing:border-box;background:#07111c;color:#fff;border:1px solid #29435c;border-radius:10px;padding:11px}textarea{min-height:130px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}button{padding:12px 16px;border:0;border-radius:10px;background:#17314a;color:#fff;font-weight:800}button.primary{background:#7657ed}button:disabled{opacity:.5}canvas{width:100%;height:auto;display:block;background:#02060b;border-radius:14px;margin-top:15px}.status{color:#9eb5c8;margin-top:10px;font-weight:700}.bar{height:9px;background:#162739;border-radius:8px;margin-top:8px;overflow:hidden}.fill{height:100%;width:0;background:#46d9ef;transition:width .08s linear}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}.actions button{width:100%}}</style></head><body><main><h1>✦ ANTENEH AI STUDIO</h1><p>Any subject → visual educational video. Local generation • no API key.</p><section class="panel"><textarea id="topic" placeholder="Enter any topic or full lesson script..."></textarea><div class="grid"><label>Length<select id="length"><option value="60">60 seconds</option><option value="90" selected>90 seconds</option><option value="120">2 minutes</option><option value="300">5 minutes</option></select></label><label>Style<select id="style"><option>Clean explainer</option><option>Whiteboard</option><option>Modern presentation</option><option>Minimal motion graphics</option></select></label><label>Ratio<select id="ratio"><option>16:9</option><option>9:16</option><option>1:1</option><option>4:5</option><option>21:9</option></select></label><label>Visual intelligence<select id="mode"><option>Auto</option><option>Diagram focused</option><option>Process focused</option><option>Presentation focused</option></select></label></div><div class="actions"><button class="primary" id="generate">Generate Video ▶</button><button id="preview">Preview Storyboard</button><button id="save">Save</button><button id="restore">Restore</button></div><div id="status" class="status">Ready.</div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="panel"><canvas id="canvas"></canvas><a id="download" hidden style="display:inline-block;margin-top:12px;background:white;color:#06101a;padding:11px 15px;border-radius:9px;font-weight:800">Download video</a><div id="scenes"></div></section></main><script>(()=>{const $=x=>document.getElementById(x),topic=$('topic'),len=$('length'),style=$('style'),ratio=$('ratio'),mode=$('mode'),gen=$('generate'),prev=$('preview'),save=$('save'),restore=$('restore'),status=$('status'),fill=$('fill'),c=$('canvas'),x=c.getContext('2d'),dl=$('download'),list=$('scenes');let scenes=[],timer=0,busy=false;const FPS=8;function size(){return ({'16:9':[1280,720],'9:16':[720,1280],'1:1':[1080,1080],'4:5':[864,1080],'21:9':[1260,540]})[ratio.value]}function classify(text){let q=(topic.value+' '+text).toLowerCase();if(/photosynthesis|plant|chlorophyll|leaf|sunlight|glucose|oxygen/.test(q))return'photosynthesis';if(/volcano|eruption|magma|lava|tectonic/.test(q))return'volcano';if(/greenhouse|climate|carbon dioxide|co2|warming/.test(q))return'climate';if(/water cycle|evaporation|condensation|precipitation/.test(q))return'cycle';if(/process|step|how .* work|procedure|method/.test(q))return'process';if(/cause|effect|because|result|leads to|impact/.test(q))return'cause';if(/compare|versus|difference|similar|contrast/.test(q))return'compare';if(/timeline|history|year|century|before|after/.test(q))return'timeline';if(/formula|equation|calculate|math|equals|plus|minus|multiply|divide/.test(q))return'formula';if(/warning|danger|risk|avoid|safety/.test(q))return'warning';return'concept'}function make(t){let p=t.trim().split(/(?<=[.!?])\s+|\n+/).map(s=>s.trim()).filter(Boolean);if(p.length<3){let s=t.trim().replace(/[?.!]$/,'');p=[`What is ${s}?`,`How does ${s} work?`,`What are the main ideas of ${s}?`,`Why does ${s} matter?`,`What is an example of ${s}?`,`Key takeaway: ${s}.`]}return p.slice(0,12).map((text,i)=>({title:i===0?t.trim().replace(/[.!?]$/,''):(i===p.length-1?'Key takeaway':'Key idea '+(i+1)),text,kind:classify(text)}))}function setup(){if(!topic.value.trim()){status.textContent='Please enter a topic or script.';return false}clearTimeout(timer);scenes=make(topic.value);let d=size();c.width=d[0];c.height=d[1];list.innerHTML=scenes.map((s,i)=>`<p><b>${i+1}. ${s.title}</b> — ${s.text}</p>`).join('');fill.style.width='0%';draw(scenes[0],0);return true}function textBlock(text,px,py,maxW,fs){x.font='600 '+fs+'px system-ui';let line='',y=py;for(const word of text.split(/\s+/)){let n=line?line+' '+word:word;if(x.measureText(n).width>maxW&&line){x.fillText(line,px,y);y+=fs*1.35;line=word}else line=n}if(line)x.fillText(line,px,y);return y}function box(cx,cy,w,h,label){x.fillStyle='#102d43';x.strokeStyle='#49ddf6';x.lineWidth=4;x.beginPath();x.roundRect(cx-w/2,cy-h/2,w,h,18);x.fill();x.stroke();x.fillStyle='#fff';x.textAlign='center';x.font='900 '+Math.max(16,Math.min(w/8,30))+'px system-ui';x.fillText(label,cx,cy+10);x.textAlign='left'}function arrow(x1,y1,x2,y2){x.strokeStyle='#61e3ff';x.lineWidth=6;x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();let a=Math.atan2(y2-y1,x2-x1);x.fillStyle='#61e3ff';x.beginPath();x.moveTo(x2,y2);x.lineTo(x2-18*Math.cos(a-.5),y2-18*Math.sin(a-.5));x.lineTo(x2-18*Math.cos(a+.5),y2-18*Math.sin(a+.5));x.fill()}function draw(s,t){let w=c.width,h=c.height,q=s.kind;x.fillStyle='#06111c';x.fillRect(0,0,w,h);x.fillStyle='#61e3ff';x.font='900 '+Math.max(24,w/30)+'px system-ui';textBlock(s.title,w*.07,h*.11,w*.86,Math.max(24,w/30));x.fillStyle='#fff';textBlock(s.text,w*.07,h*.22,w*.86,Math.max(18,w/62));let cx=w/2,cy=h*.63,scale=Math.min(w,h);if(q==='photosynthesis'){x.fillStyle='#ffd84d';x.beginPath();x.arc(cx-scale*.27,cy-scale*.05,scale*.10,0,7);x.fill();arrow(cx-scale*.17,cy-scale*.05,cx-scale*.06,cy);box(cx+scale*.10,cy,scale*.28,scale*.20,'LEAF');arrow(cx+scale*.24,cy,cx+scale*.36,cy-scale*.08);box(cx+scale*.43,cy-scale*.08,scale*.25,scale*.18,'GLUCOSE');x.fillStyle='#9effa8';x.font='800 '+Math.max(16,scale/34)+'px system-ui';x.fillText('CO₂ + WATER + SUNLIGHT',cx-scale*.25,cy+scale*.18)}else if(q==='volcano'){x.fillStyle='#263b4d';x.beginPath();x.moveTo(cx-scale*.28,cy+scale*.20);x.lineTo(cx-scale*.10,cy-scale*.05);x.lineTo(cx,cy-scale*.18);x.lineTo(cx+scale*.10,cy-scale*.05);x.lineTo(cx+scale*.28,cy+scale*.20);x.closePath();x.fill();x.fillStyle='#ff7043';x.beginPath();x.arc(cx,cy-scale*.18,scale*.07,0,7);x.fill();arrow(cx,cy-scale*.11,cx-scale*.08,cy-scale*.30);arrow(cx,cy-scale*.11,cx+scale*.08,cy-scale*.30);x.fillStyle='#ffb36b';x.font='900 '+Math.max(18,scale/32)+'px system-ui';x.textAlign='center';x.fillText('MAGMA → PRESSURE → ERUPTION → LAVA',cx,cy+scale*.28);x.textAlign='left'}else if(q==='climate'){box(cx-scale*.27,cy,scale*.28,scale*.18,'SUN');arrow(cx-scale*.12,cy,cx-scale*.02,cy);box(cx+scale*.10,cy,scale*.30,scale*.18,'EARTH');arrow(cx+scale*.25,cy,cx+scale*.34,cy-scale*.13);arrow(cx+scale*.34,cy-scale*.13,cx+scale*.18,cy-scale*.22);x.fillStyle='#7ddfff';x.font='900 '+Math.max(16,scale/38)+'px system-ui';x.fillText('HEAT TRAPPED BY GASES',cx-scale*.27,cy+scale*.22)}else if(q==='compare'){box(cx-scale*.25,cy,scale*.32,scale*.22,'A');box(cx+scale*.25,cy,scale*.32,scale*.22,'B');x.fillStyle='#fff';x.font='800 '+Math.max(16,scale/40)+'px system-ui';x.textAlign='center';x.fillText('SIMILARITIES',cx,cy-scale*.18);x.fillText('DIFFERENCES',cx,cy+scale*.22);x.textAlign='left'}else if(q==='cycle'){let r=scale*.16;x.strokeStyle='#49ddf6';x.lineWidth=10;x.beginPath();x.arc(cx,cy,r,0,Math.PI*1.65);x.stroke();arrow(cx+r*.72,cy+r*.7,cx+r*.45,cy+r*.98);x.fillStyle='#fff';x.font='900 '+Math.max(18,scale/34)+'px system-ui';x.textAlign='center';x.fillText('REPEATING CYCLE',cx,cy+scale*.30);x.textAlign='left'}else if(q==='formula'){x.fillStyle='#fff';x.font='900 '+Math.max(24,scale/24)+'px system-ui';x.textAlign='center';x.fillText(s.text.replace(/[^0-9A-Za-z+\-*/=→(). ]/g,'').slice(0,48),cx,cy);x.textAlign='left'}else if(q==='warning'){x.fillStyle='#ffb347';x.beginPath();x.moveTo(cx,cy-scale*.18);x.lineTo(cx-scale*.20,cy+scale*.18);x.lineTo(cx+scale*.20,cy+scale*.18);x.closePath();x.fill();x.fillStyle='#07111c';x.textAlign='center';x.font='900 '+Math.max(28,scale/20)+'px system-ui';x.fillText('!',cx,cy+scale*.08);x.textAlign='left'}else if(q==='process'||mode.value==='Process focused'){box(cx-scale*.25,cy,scale*.22,scale*.16,'1');arrow(cx-scale*.12,cy,cx-scale*.01,cy);box(cx+scale*.10,cy,scale*.22,scale*.16,'2');arrow(cx+scale*.21,cy,cx+scale*.32,cy);box(cx+scale*.43,cy,scale*.22,scale*.16,'3')}else{let r=scale*.13*(1+.04*Math.sin(t/350));x.fillStyle='#102d43';x.strokeStyle='#49ddf6';x.lineWidth=4;x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.fill();x.stroke();x.fillStyle='#fff';x.textAlign='center';x.font='900 '+Math.max(17,w/55)+'px system-ui';x.fillText('CORE IDEA',cx,cy+7);x.textAlign='left';arrow(cx-r*1.8,cy,cx-r,cy);arrow(cx+r,cy,cx+r*1.8,cy)}x.fillStyle='#91aabd';x.font='700 12px system-ui';x.fillText(style.value.toUpperCase()+' • '+ratio.value+' • '+q.toUpperCase(),w*.07,h*.92)}function play(ms,done,label){let start=performance.now(),each=ms/scenes.length,interval=Math.max(50,1000/FPS),last=-1;function f(){let now=performance.now(),e=now-start,p=Math.min(100,e/ms*100),i=Math.min(scenes.length-1,Math.floor(e/each));if(i!==last){draw(scenes[i],now);last=i}else draw(scenes[i],now);fill.style.width=p.toFixed(1)+'%';status.textContent=label+' '+Math.floor(p)+'%';if(e<ms)timer=setTimeout(f,interval);else{clearTimeout(timer);fill.style.width='100%';status.textContent=label+' 100%';done()}}f()}prev.onclick=()=>{if(busy||!setup())return;status.textContent='Preview playing 0%';play(Math.min(15000,+len.value*1000),()=>status.textContent='Preview complete.','Preview')};gen.onclick=()=>{if(busy||!setup())return;if(!c.captureStream||!window.MediaRecorder){status.textContent='Video export is not supported by this browser. Use Chrome/Chromium.';return}busy=true;gen.disabled=true;prev.disabled=true;dl.hidden=true;fill.style.width='0%';status.textContent='Generating video 0%';let total=+len.value*1000,stream=c.captureStream(FPS),mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':MediaRecorder.isTypeSupported('video/webm;codecs=vp8')?'video/webm;codecs=vp8':'video/webm',rec;try{rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:1400000})}catch(e){rec=new MediaRecorder(stream)}let chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};rec.onerror=()=>{clearTimeout(timer);status.textContent='Video recording failed. Try Chrome/Chromium.';busy=false;gen.disabled=false;prev.disabled=false};rec.onstop=()=>{clearTimeout(timer);let blob=new Blob(chunks,{type:'video/webm'}),url=URL.createObjectURL(blob);dl.href=url;dl.download='anteneh-ai-studio-video.webm';dl.hidden=false;status.textContent='Video ready — 100% • tap Download video.';busy=false;gen.disabled=false;prev.disabled=false};rec.start();play(total,()=>setTimeout(()=>rec.stop(),120),'Generating video')};save.onclick=()=>{localStorage.setItem('anteneh-ai-studio-project',JSON.stringify({topic:topic.value,length:len.value,style:style.value,ratio:ratio.value,mode:mode.value}));status.textContent='Project saved on this device.'};restore.onclick=()=>{try{let p=JSON.parse(localStorage.getItem('anteneh-ai-studio-project')||'null');if(!p){status.textContent='No saved project found.';return}topic.value=p.topic||'';len.value=p.length||'90';style.value=p.style||style.value;ratio.value=p.ratio||ratio.value;mode.value=p.mode||mode.value;setup();status.textContent='Project restored.'}catch(e){status.textContent='Could not restore saved project.'}};ratio.onchange=()=>{if(topic.value.trim())setup()};})();</script></body></html>
