<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANTENEH AI STUDIO</title><style>body{margin:0;background:#050a12;color:#eef7ff;font:15px system-ui;padding:18px}main{max-width:1000px;margin:auto}.panel{background:#0b1622;border:1px solid #23405a;border-radius:18px;padding:18px;margin:15px 0}textarea,select,button{font:inherit}textarea,select{width:100%;box-sizing:border-box;background:#07111c;color:#fff;border:1px solid #29435c;border-radius:10px;padding:11px}textarea{min-height:130px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}button{padding:12px 16px;border:0;border-radius:10px;background:#17314a;color:#fff;font-weight:800}button.primary{background:#7657ed}button:disabled{opacity:.5}canvas{width:100%;height:auto;display:block;background:#02060b;border-radius:14px;margin-top:15px}.status{color:#9eb5c8;margin-top:10px;font-weight:700}.bar{height:9px;background:#162739;border-radius:8px;margin-top:8px;overflow:hidden}.fill{height:100%;width:0;background:#46d9ef;transition:width .08s linear}.watch{margin-top:15px;background:#02060b;border-radius:14px;overflow:hidden;border:1px solid #20364a}.watch video{width:100%;display:block;background:#000;max-height:620px}.watch .watch-title{padding:10px 12px;color:#9eb5c8;font-weight:700}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}.actions button{width:100%}}</style></head><body><main><h1>✦ ANTENEH AI STUDIO</h1><p>Any subject → visual educational video. Local generation • no API key.</p><section class="panel"><textarea id="topic" placeholder="Enter any topic or full lesson script..."></textarea><div class="grid"><label>Length<select id="length"><option value="60">60 seconds</option><option value="90" selected>90 seconds</option><option value="120">2 minutes</option><option value="300">5 minutes</option></select></label><label>Style<select id="style"><option>Clean explainer</option><option>Whiteboard</option><option>Modern presentation</option><option>Minimal motion graphics</option></select></label><label>Ratio<select id="ratio"><option>16:9</option><option>9:16</option><option>1:1</option><option>4:5</option><option>21:9</option></select></label><label>Visual intelligence<select id="mode"><option>Auto</option><option>Diagram focused</option><option>Process focused</option><option>Presentation focused</option></select></label></div><div class="actions"><button class="primary" id="generate">Generate Video ▶</button><button id="preview">Preview Storyboard</button><button id="save">Save</button><button id="restore">Restore</button></div><div id="status" class="status">Ready.</div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="panel"><canvas id="canvas"></canvas><div id="watch" class="watch" hidden><div class="watch-title">▶ Watch your generated video before downloading</div><video id="videoPreview" controls playsinline preload="metadata"></video></div><a id="download" hidden style="display:inline-block;margin-top:12px;background:white;color:#06101a;padding:11px 15px;border-radius:9px;font-weight:800">Download video</a><div id="scenes"></div></section></main><script>(()=>{const $=x=>document.getElementById(x),topic=$("topic"),len=$("length"),style=$("style"),ratio=$("ratio"),mode=$("mode"),gen=$("generate"),prev=$("preview"),save=$("save"),restore=$("restore"),status=$("status"),fill=$("fill"),c=$("canvas"),x=c.getContext("2d"),dl=$("download"),list=$("scenes"),watch=$("watch"),video=$("videoPreview");let scenes=[],timer=0,busy=false;const FPS=15,STOPWORDS=new Set("the a an and or of to in on for with from by is are was were be this that as how what why does do did can may will into about it its their they them these those your you we our their than then there here have has had not but which when where who whose through during after before because result results main key important means using use used between both each more most some such example examples first next finally also very”.split(/\s+/));function words(s){return (s.toLowerCase().match(/[a-zA-ZÀ-ÿ0-9]+/g)||[]).filter(w=>w.length>3&&!STOPWORDS.has(w))}function cleanLabel(s,max=18){let a=(s||"").replace(/[^\w\sÀ-ÿ-]/g," ").trim().split(/\s+/).filter(Boolean);return a.slice(0,Math.min(3,Math.ceil(max/8))).join(" ").toUpperCase().slice(0,max)}function make(t){let p=t.trim().split(/(?<=[.!?])\s+|\n+/).map(s=>s.trim()).filter(Boolean);if(p.length<3){let q=t.trim().replace(/[?.!]$/,"");p=[`What is ${q}?`,`How does ${q} work?`,`What causes ${q}?`,`What are the main parts of ${q}?`,`What is an example of ${q}?`,`Key takeaway: ${q}.`]}return p.slice(0,12).map((text,i)=>{let kw=words(text);let title=i===0?"The big question":i===p.length-1?"Key takeaway":cleanLabel(kw.slice(0,4).join(" "))||"Key idea "+(i+1);return{title,text,keywords:kw.slice(0,8)}})}function sceneKind(s){let q=(s.title+" "+s.text).toLowerCase();if(/how|process|step|first|then|next|finally|cycle|convert|change|flow/.test(q))return"process";if(/compare|difference|versus|than|both|while/.test(q))return"compare";if(/cause|because|leads|result|effect|why|therefore/.test(q))return"cause";if(/example|such as|for instance|e\.g\./.test(q))return"example";if(/formula|equation|plus|minus|equals|→|->/.test(q))return"formula";if(/part|structure|contains|consists|component|system/.test(q))return"diagram";if(mode.value==="Diagram focused")return"diagram";if(mode.value==="Process focused")return"process";return"concept"}function setup(){if(!topic.value.trim()){status.textContent="Please enter a topic or script.";return false}clearTimeout(timer);scenes=make(topic.value);let d=size();c.width=d[0];c.height=d[1];list.innerHTML=scenes.map((s,i)=>`<p><b>${i+1}. ${s.title}</b> — ${s.text}</p>`).join("");fill.style.width="0%";draw(scenes[0],0,0);return true}function size(){return ({"16:9":[1280,720],"9:16":[720,1280],"1:1":[1080,1080],"4:5":[864,1080],"21:9":[1260,540]})[ratio.value]}function wrap(text,max,fs){x.font=`700 ${fs}px system-ui`;let out=[],line="";for(const w of text.split(/\s+/)){let n=line?line+" "+w:w;if(x.measureText(n).width>max&&line){out.push(line);line=w}else line=n}if(line)out.push(line);return out}function rr(px,py,w,h,r,fill,stroke){x.beginPath();x.roundRect(px,py,w,h,r);if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.strokeStyle=stroke;x.lineWidth=3;x.stroke()}}function arrow(ax,ay,bx,by,p){let a=Math.atan2(by-ay,bx-ax),d=Math.hypot(bx-ax,by-ay),head=Math.min(26,Math.max(12,d*.12));x.save();x.strokeStyle="#61e3ff";x.lineWidth=Math.max(4,c.width/240);x.lineCap="round";x.setLineDash([16,12]);x.lineDashOffset=-p*d;x.beginPath();x.moveTo(ax,ay);x.lineTo(bx,by);x.stroke();x.setLineDash([]);x.fillStyle="#61e3ff";x.beginPath();x.moveTo(bx,by);x.lineTo(bx-head*Math.cos(a-.48),by-head*Math.sin(a-.48));x.lineTo(bx-head*Math.cos(a+.48),by-head*Math.sin(a+.48));x.closePath();x.fill();x.restore()}function node(px,py,label,r,scale=1,active=0){let rrn=r*scale;x.save();x.shadowBlur=active?24:10;x.shadowColor="#36d7f4";x.fillStyle=active?"#174b63":"#102d43";x.strokeStyle="#4be0fa";x.lineWidth=Math.max(3,c.width/320);x.beginPath();x.arc(px,py,rrn,0,Math.PI*2);x.fill();x.stroke();x.shadowBlur=0;x.fillStyle="#fff";x.textAlign="center";x.textBaseline="middle";x.font=`800 ${Math.max(13,c.width/78)*scale}px system-ui`;wrap(cleanLabel(label,22),rrn*1.7,Math.max(13,c.width/78)*scale).slice(0,3).forEach((z,i)=>x.fillText(z,px,py+(i-1)*Math.max(16,c.width/90)));x.restore()}function draw(s,t,p){let w=c.width,h=c.height,k=Math.max(0,Math.min(1,p)),kind=sceneKind(s),title=s.title||"Lesson";x.clearRect(0,0,w,h);let g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,"#061525");g.addColorStop(1,"#02060b");x.fillStyle=g;x.fillRect(0,0,w,h);x.globalAlpha=.14;x.strokeStyle="#36d7f4";x.lineWidth=2;let drift=(t*.025)%80;for(let yy=-80;yy<h+80;yy+=80){x.beginPath();x.moveTo(0,yy+drift);x.lineTo(w,yy+drift);x.stroke()}x.globalAlpha=1;let fs=Math.max(25,w/31);x.fillStyle="#61e3ff";x.font=`900 ${fs}px system-ui`;x.fillText(cleanLabel(title,34),w*.07,h*.12);let lines=wrap(s.text,w*.78,Math.max(18,w/62));x.fillStyle="#fff";x.font=`700 ${Math.max(18,w/62)}px system-ui`;lines.slice(0,4).forEach((v,i)=>x.fillText(v,w*.07,h*.20+i*Math.max(18,w/62)*1.35));let cx=w/2,cy=h*.64,r=Math.min(w,h)*.105,kw=s.keywords&&s.keywords.length?s.keywords:[cleanLabel(topic.value,20)];if(kind==="process"){let n=Math.min(4,Math.max(3,kw.length));let gap=w*.22, start=cx-gap*(n-1)/2;for(let i=0;i<n;i++){let q=kw[i]||["INPUT","CHANGE","RESULT","IMPACT"][i],px=start+i*gap,py=cy+Math.sin(k*Math.PI+i)*Math.min(h*.07,30);node(px,py,q,r,1,i===Math.floor(k*n));if(i<n-1)arrow(px+r,py,start+(i+1)*gap-r,cy+Math.sin(k*Math.PI+i+1)*Math.min(h*.07,30),k+i*.1)}}else if(kind==="compare"){let left=kw[0]||"A",right=kw[1]||"B";let slide=Math.min(1,k*1.4),lx=cx-w*.22*slide,rx=cx+w*.22*slide;rr(lx-w*.13,cy-r,w*.26,r*2,22,"#102d43","#4be0fa");rr(rx-w*.13,cy-r,w*.26,r*2,22,"#102d43","#4be0fa");x.fillStyle="#fff";x.textAlign="center";x.font=`900 ${Math.max(17,w/60)}px system-ui`;x.fillText(cleanLabel(left,20),lx,cy);x.fillText(cleanLabel(right,20),rx,cy);x.fillStyle="#61e3ff";x.font=`800 ${Math.max(13,w/90)}px system-ui`;x.fillText("COMPARE",cx,cy+r*1.7);arrow(lx+w*.14,cy,rx-w*.14,cy,k)}else if(kind==="cause"){let a=kw[0]||"CAUSE",b=kw[1]||"EFFECT";let shift=Math.sin(k*Math.PI)*w*.04;node(cx-w*.23-shift,cy,a,r,1,k>.2);node(cx+w*.23+shift,cy,b,r,1,k>.55);arrow(cx-w*.23+r-shift,cy,cx+w*.23-r+shift,cy,k)}else if(kind==="example"){node(cx,cy-r*.45,kw[0]||cleanLabel(title,18),r,1,.5+k*.5);let ex=kw.slice(1,4);ex.forEach((q,i)=>{let px=cx+(i-1)*w*.20,py=cy+r*1.25+Math.sin((k+i)*Math.PI)*18;node(px,py,q,r*.62,.9,k>.45+i*.12);arrow(cx,cy+r*.25,px,py-r*.62,k+i*.15)})}else if(kind==="formula"){let parts=(s.text.match(/[A-Za-zÀ-ÿ0-9]+|[+\-×÷=→]/g)||[]).slice(0,7);let total=parts.length;let gap=Math.min(w*.13,120),sx=cx-(total-1)*gap/2;parts.forEach((q,i)=>{let py=cy+Math.sin(k*Math.PI+i*.7)*25;rr(sx+i*gap-r*.7,py-r*.55,r*1.4,r*1.1,18,i===Math.floor(k*total)?"#174b63":"#102d43","#4be0fa");x.fillStyle="#fff";x.textAlign="center";x.textBaseline="middle";x.font=`900 ${Math.max(18,w/60)}px system-ui`;x.fillText(q,sx+i*gap,py)})}else if(kind==="diagram"){node(cx,cy,kw[0]||cleanLabel(title,18),r,1,.5+k*.5);let n=Math.min(5,Math.max(3,kw.length-1));let spin=t*.0007;for(let i=0;i<n;i++){let a=spin+i*Math.PI*2/n,rad=r*2.5,px=cx+Math.cos(a)*rad,py=cy+Math.sin(a)*rad;node(px,py,kw[i+1]||["PART","INPUT","PROCESS","OUTPUT","IMPACT"][i],r*.62,.85,k>.2+i*.12);arrow(cx+Math.cos(a)*r,cy+Math.sin(a)*r,px-Math.cos(a)*r*.55,py-Math.sin(a)*r*.55,k+i*.08)}}else{let main=kw.slice(0,1).join(" ")||cleanLabel(title,20);let rrn=r*(1+.10*Math.sin(t/180));node(cx,cy,main,rrn,1,.7+k*.3);kw.slice(1,5).forEach((q,i)=>{let a=t*.0008+i*Math.PI*2/4,rad=r*2.35,px=cx+Math.cos(a)*rad,py=cy+Math.sin(a)*rad;node(px,py,q,r*.55,.8,k>.45);arrow(cx+Math.cos(a)*rrn,cy+Math.sin(a)*rrn,px-Math.cos(a)*r*.45,py-Math.sin(a)*r*.45,k+i*.1)})}x.fillStyle="#91aabd";x.font="700 12px system-ui";x.textAlign="left";x.fillText(style.value.toUpperCase()+" • "+ratio.value+" • "+kind.toUpperCase(),w*.07,h*.92)}function play(ms,done,label){let start=performance.now(),each=ms/scenes.length,interval=1000/FPS;function f(){let now=performance.now(),e=now-start,p=Math.min(100,e/ms*100),i=Math.min(scenes.length-1,Math.floor(e/each)),local=Math.min(1,Math.max(0,(e-i*each)/each));draw(scenes[i],now,local);fill.style.width=p.toFixed(1)+"%";status.textContent=label+" "+Math.floor(p)+"%";if(e<ms)timer=setTimeout(f,interval);else{clearTimeout(timer);draw(scenes[scenes.length-1],now,1);fill.style.width="100%";status.textContent=label+" 100%";done()}}f()}prev.onclick=()=>{if(busy||!setup())return;busy=true;gen.disabled=true;prev.disabled=true;status.textContent="Building semantic motion storyboard…";play(Math.min(15000,+len.value*1000),()=>{busy=false;gen.disabled=false;prev.disabled=false;status.textContent="Motion preview complete."},"Preview")};gen.onclick=()=>{if(busy||!setup())return;if(!c.captureStream||!window.MediaRecorder){status.textContent="Video export is not supported by this browser. Use Chrome/Chromium.";return}busy=true;gen.disabled=true;prev.disabled=true;dl.hidden=true;watch.hidden=true;fill.style.width="0%";let total=+len.value*1000,stream=c.captureStream(FPS),mime=MediaRecorder.isTypeSupported("video/webm;codecs=vp9")?"video/webm;codecs=vp9":MediaRecorder.isTypeSupported("video/webm;codecs=vp8")?"video/webm;codecs=vp8":"video/webm",rec;try{rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:1800000})}catch(e){rec=new MediaRecorder(stream)}let chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};rec.onerror=()=>{clearTimeout(timer);stream.getTracks().forEach(t=>t.stop());status.textContent="Video recording failed. Try Chrome/Chromium.";busy=false;gen.disabled=false;prev.disabled=false};rec.onstop=()=>{clearTimeout(timer);stream.getTracks().forEach(t=>t.stop());let blob=new Blob(chunks,{type:"video/webm"}),url=URL.createObjectURL(blob);video.src=url;watch.hidden=false;dl.href=url;dl.download="anteneh-ai-studio-video.webm";dl.hidden=false;status.textContent="Real animated educational video ready — watch it above, then download.";busy=false;gen.disabled=false;prev.disabled=false};rec.start(1000);play(total,()=>setTimeout(()=>rec.stop(),180),"Generating")};save.onclick=()=>{localStorage.setItem("anteneh-ai-studio-project",JSON.stringify({topic:topic.value,length:len.value,style:style.value,ratio:ratio.value,mode:mode.value}));status.textContent="Project saved on this device."};restore.onclick=()=>{try{let p=JSON.parse(localStorage.getItem("anteneh-ai-studio-project")||"null");if(!p){status.textContent="No saved project found.";return}topic.value=p.topic||"";len.value=p.length||"90";style.value=p.style||style.value;ratio.value=p.ratio||ratio.value;mod
