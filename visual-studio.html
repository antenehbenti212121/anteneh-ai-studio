<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANTENEH AI STUDIO</title><style>body{margin:0;background:#050a12;color:#eef7ff;font:15px system-ui;padding:18px}main{max-width:1000px;margin:auto}.panel{background:#0b1622;border:1px solid #23405a;border-radius:18px;padding:18px;margin:15px 0}textarea,select,button{font:inherit}textarea,select{width:100%;box-sizing:border-box;background:#07111c;color:#fff;border:1px solid #29435c;border-radius:10px;padding:11px}textarea{min-height:130px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}button{padding:12px 16px;border:0;border-radius:10px;background:#17314a;color:#fff;font-weight:800}button.primary{background:#7657ed}button:disabled{opacity:.5}canvas{width:100%;height:auto;display:block;background:#02060b;border-radius:14px;margin-top:15px}.status{color:#9eb5c8;margin-top:10px;font-weight:700}.bar{height:9px;background:#162739;border-radius:8px;margin-top:8px;overflow:hidden}.fill{height:100%;width:0;background:#46d9ef;transition:width .08s linear}.watch{margin-top:15px;background:#02060b;border-radius:14px;overflow:hidden;border:1px solid #20364a}.watch video{width:100%;display:block;background:#000;max-height:620px}.watch .watch-title{padding:10px 12px;color:#9eb5c8;font-weight:700}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}.actions button{width:100%}}</style></head><body><main><h1>✦ ANTENEH AI STUDIO</h1><p>Any subject → visual educational video. Local generation • no API key.</p><section class="panel"><textarea id="topic" placeholder="Enter any topic or full lesson script..."></textarea><div class="grid"><label>Length<select id="length"><option value="60">60 seconds</option><option value="90" selected>90 seconds</option><option value="120">2 minutes</option><option value="300">5 minutes</option></select></label><label>Style<select id="style"><option>Clean explainer</option><option>Whiteboard</option><option>Modern presentation</option><option>Minimal motion graphics</option></select></label><label>Ratio<select id="ratio"><option>16:9</option><option>9:16</option><option>1:1</option><option>4:5</option><option>21:9</option></select></label><label>Visual intelligence<select id="mode"><option>Auto</option><option>Diagram focused</option><option>Process focused</option><option>Presentation focused</option></select></label></div><div class="actions"><button class="primary" id="generate">Generate Video ▶</button><button id="preview">Preview Storyboard</button><button id="save">Save</button><button id="restore">Restore</button></div><div id="status" class="status">Ready.</div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="panel"><canvas id="canvas"></canvas><div id="watch" class="watch" hidden><div class="watch-title">▶ Watch your generated video before downloading</div><video id="videoPreview" controls playsinline preload="metadata"></video></div><a id="download" hidden style="display:inline-block;margin-top:12px;background:white;color:#06101a;padding:11px 15px;border-radius:9px;font-weight:800">Download video</a><div id="scenes"></div></section></main><script>(()=>{const $=x=>document.getElementById(x),topic=$("topic"),len=$("length"),style=$("style"),ratio=$("ratio"),mode=$("mode"),gen=$("generate"),prev=$("preview"),save=$("save"),restore=$("restore"),status=$("status"),fill=$("fill"),c=$("canvas"),x=c.getContext("2d"),dl=$("download"),list=$("scenes"),watch=$("watch"),video=$("videoPreview");let scenes=[],timer=0,busy=false;const FPS=15;function size(){return ({"16:9":[1280,720],"9:16":[720,1280],"1:1":[1080,1080],"4:5":[864,1080],"21:9":[1260,540]})[ratio.value]}function make(t){let p=t.trim().split(/(?<=[.!?])\s+|\n+/).map(s=>s.trim()).filter(Boolean);if(p.length<3){let s=t.trim().replace(/[?.!]$/,"");p=[`What is ${s}?`,`How does ${s} work?`,`What are the main ideas of ${s}?`,`Why does ${s} matter?`,`What is an example of ${s}?`,`Key takeaway: ${s}.`]}return p.slice(0,12).map((text,i)=>({title:i===0?"The big question":i===p.length-1?"Key takeaway":"Key idea "+(i+1),text}))}function sceneKind(s){let q=(s.title+" "+s.text).toLowerCase();if(/how|process|step|first|then|next|finally|cycle/.test(q))return"process";if(/compare|difference|versus|than|both/.test(q))return"compare";if(/cause|because|leads|result|effect|why/.test(q))return"cause";if(/example|such as|for instance/.test(q))return"example";return mode.value==="Diagram focused"?"diagram":mode.value==="Process focused"?"process":"concept"}function setup(){if(!topic.value.trim()){status.textContent="Please enter a topic or script.";return false}clearTimeout(timer);scenes=make(topic.value);let d=size();c.width=d[0];c.height=d[1];list.innerHTML=scenes.map((s,i)=>`<p><b>${i+1}. ${s.title}</b> — ${s.text}</p>`).join("");fill.style.width="0%";draw(scenes[0],0,0);return true}function roundRect(cx,xx,yy,ww,hh,rr){cx.beginPath();cx.roundRect(xx,yy,ww,hh,rr);cx.fill()}function wrap(text,max,fs){x.font=`700 ${fs}px system-ui`;let out=[],line="";for(const w of text.split(/\s+/)){let n=line?line+" "+w:w;if(x.measureText(n).width>max&&line){out.push(line);line=w}else line=n}if(line)out.push(line);return out}function draw(s,t,sceneProgress){let w=c.width,h=c.height,k=Math.max(0,Math.min(1,sceneProgress)),kind=sceneKind(s);x.clearRect(0,0,w,h);let g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,"#061525");g.addColorStop(1,"#02060b");x.fillStyle=g;x.fillRect(0,0,w,h);x.globalAlpha=.18;x.strokeStyle="#36d7f4";x.lineWidth=2;for(let yy=0;yy<h;yy+=70){x.beginPath();x.moveTo(0,yy+(t*.025)%70);x.lineTo(w,yy+(t*.025)%70);x.stroke()}x.globalAlpha=1;let titleY=h*.12;x.fillStyle="#61e3ff";x.font="900 "+Math.max(24,w/30)+"px system-ui";x.fillText(s.title,w*.07,titleY);let lines=wrap(s.text,w*.78,Math.max(18,w/62));x.fillStyle="#fff";lines.slice(0,4).forEach((v,i)=>x.fillText(v,w*.07,h*.21+i*Math.max(18,w/62)*1.35));let cx=w/2,cy=h*.62,base=Math.min(w,h)*.15,move=Math.sin(k*Math.PI)*Math.min(w,h)*.11;function node(px,py,label,scale=1){let r=base*.7*scale;x.fillStyle="#102d43";x.strokeStyle="#4be0fa";x.lineWidth=4;x.beginPath();x.arc(px,py,r,0,Math.PI*2);x.fill();x.stroke();x.fillStyle="#fff";x.textAlign="center";x.font="800 "+Math.max(15,w/70)*scale+"px system-ui";let ls=wrap(label,Math.max(100,r*1.7),Math.max(13,w/78)*scale);ls.slice(0,3).forEach((z,i)=>x.fillText(z,px,py+(i-(ls.length-1)/2)*18));x.textAlign="left"}function arrow(ax,ay,bx,by,p){x.save();x.strokeStyle="#61e3ff";x.lineWidth=Math.max(5,w/180);x.setLineDash([18,14]);x.lineDashOffset=-p*180;x.beginPath();x.moveTo(ax,ay);x.lineTo(bx,by);x.stroke();x.setLineDash([]);let a=Math.atan2(by-ay,bx-ax);x.fillStyle="#61e3ff";x.beginPath();x.moveTo(bx,by);x.lineTo(bx-24*Math.cos(a-.45),by-24*Math.sin(a-.45));x.lineTo(bx-24*Math.cos(a+.45),by-24*Math.sin(a+.45));x.closePath();x.fill();x.restore()}if(kind==="process"){let y=cy, gap=w*.22;let pts=[cx-gap,cx,cx+gap];node(pts[0]+move,y,"START");node(pts[1],y,"CHANGE");node(pts[2]-move,y,"RESULT");arrow(pts[0]+base*.7+move,y,pts[1]-base*.7,y,k);arrow(pts[1]+base*.7,y,pts[2]-base*.7-move,y,k)}else if(kind==="compare"){node(cx-w*.2,cy,"A",1+k*.08);node(cx+w*.2,cy,"B",1+k*.08);arrow(cx-w*.1,cy,cx+w*.1,cy,.5+.5*k)}else if(kind==="cause"){node(cx-w*.22,cy,"CAUSE",1);node(cx+w*.22,cy,"EFFECT",1);arrow(cx-w*.22+base*.7,cy,cx+w*.22-base*.7,cy,k)}else if(kind==="example"){node(cx,cy,"IDEA",1+k*.08);node(cx,cy+base*1.8,"EXAMPLE",.9);arrow(cx,cy+base*.75,cx,cy+base*1.45,k)}else if(kind==="diagram"){node(cx,cy,"CORE",1+k*.1);let a=t*.0015;for(let i=0;i<4;i++){let ang=a+i*Math.PI/2,px=cx+Math.cos(ang)*base*2.2,py=cy+Math.sin(ang)*base*2.2;node(px,py,["INPUT","PROCESS","OUTPUT","IMPACT"][i],.65);arrow(cx+Math.cos(ang)*base*.75,cy+Math.sin(ang)*base*.75,px-Math.cos(ang)*base*.55,py-Math.sin(ang)*base*.55,k)}}else{let r=base*(1+.18*Math.sin(t/220));x.fillStyle="#102d43";x.strokeStyle="#61e3ff";x.lineWidth=5;x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.fill();x.stroke();x.fillStyle="#fff";x.textAlign="center";x.font="900 "+Math.max(20,w/48)+"px system-ui";x.fillText("KEY IDEA",cx,cy+7);x.textAlign="left";for(let i=0;i<3;i++){let px=cx+Math.cos(t/900+i*2.1)*base*2,py=cy+Math.sin(t/900+i*2.1)*base*1.5;x.fillStyle="#193c55";x.beginPath();x.arc(px,py,base*.3,0,Math.PI*2);x.fill();arrow(cx+Math.cos(t/900+i*2.1)*r,cy+Math.sin(t/900+i*2.1)*r,px,py,k)}}x.fillStyle="#91aabd";x.font="700 12px system-ui";x.fillText(style.value.toUpperCase()+" • "+ratio.value+" • "+kind.toUpperCase(),w*.07,h*.92)}function play(ms,done,label,recording){let start=performance.now(),each=ms/scenes.length,interval=1000/FPS;function f(){let now=performance.now(),e=now-start,p=Math.min(100,e/ms*100),i=Math.min(scenes.length-1,Math.floor(e/each)),local=Math.min(1,Math.max(0,(e-i*each)/each));draw(scenes[i],now,local);fill.style.width=p.toFixed(1)+"%";status.textContent=label+" "+Math.floor(p)+"%";if(e<ms)timer=setTimeout(f,interval);else{clearTimeout(timer);draw(scenes[scenes.length-1],now,1);fill.style.width="100%";status.textContent=label+" 100%";done()}}f()}prev.onclick=async()=>{if(busy||!setup())return;busy=true;gen.disabled=true;prev.disabled=true;status.textContent="Building motion storyboard…";play(Math.min(15000,+len.value*1000),()=>{busy=false;gen.disabled=false;prev.disabled=false;status.textContent="Motion preview complete."},"Preview")};gen.onclick=async()=>{if(busy||!setup())return;if(!c.captureStream||!window.MediaRecorder){status.textContent="Video export is not supported by this browser. Use Chrome/Chromium.";return}busy=true;gen.disabled=true;prev.disabled=true;dl.hidden=true;watch.hidden=true;fill.style.width="0%";status.textContent="Building real animated educational video… 0%";let total=+len.value*1000,stream=c.captureStream(FPS),mime=MediaRecorder.isTypeSupported("video/webm;codecs=vp9")?"video/webm;codecs=vp9":MediaRecorder.isTypeSupported("video/webm;codecs=vp8")?"video/webm;codecs=vp8":"video/webm",rec;try{rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:1800000})}catch(e){rec=new MediaRecorder(stream)}let chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};rec.onerror=()=>{clearTimeout(timer);status.textContent="Video recording failed. Try Chrome/Chromium.";busy=false;gen.disabled=false;prev.disabled=false};rec.onstop=()=>{clearTimeout(timer);let blob=new Blob(chunks,{type:"video/webm"}),url=URL.createObjectURL(blob);video.src=url;watch.hidden=false;dl.href=url;dl.download="anteneh-ai-studio-video.webm";dl.hidden=false;status.textContent="Real animated video ready — watch it above, then download.";busy=false;gen.disabled=false;prev.disabled=false};rec.start();play(total,()=>setTimeout(()=>rec.stop(),120),"Generating",true)};save.onclick=()=>{localStorage.setItem("anteneh-ai-studio-project",JSON.stringify({topic:topic.value,length:len.value,style:style.value,ratio:ratio.value,mode:mode.value}));status.textContent="Project saved on this device."};restore.onclick=()=>{try{let p=JSON.parse(localStorage.getItem("anteneh-ai-studio-project")||"null");if(!p){status.textContent="No saved project found.";return}topic.value=p.topic||"";len.value=p.length||"90";style.value=p.style||style.value;ratio.value=p.ratio||ratio.value;mode.value=p.mode||mode.value;setup();status.textContent="Project restored."}catch(e){status.textContent="Could not restore saved project."}};ratio.onchange=()=>{if(topic.value.trim())setup()}})();</script></body></html>
