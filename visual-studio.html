<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANTENEH AI STUDIO</title><style>body{margin:0;background:#050a12;color:#eef7ff;font:15px system-ui;padding:18px}main{max-width:1000px;margin:auto}.panel{background:#0b1622;border:1px solid #23405a;border-radius:18px;padding:18px;margin:15px 0}textarea,select,button{font:inherit}textarea,select{width:100%;box-sizing:border-box;background:#07111c;color:#fff;border:1px solid #29435c;border-radius:10px;padding:11px}textarea{min-height:130px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}button{padding:12px 16px;border:0;border-radius:10px;background:#17314a;color:#fff;font-weight:800}button.primary{background:#7657ed}button:disabled{opacity:.5}canvas{width:100%;height:auto;display:block;background:#02060b;border-radius:14px;margin-top:15px}.status{color:#9eb5c8;margin-top:10px;font-weight:700}.bar{height:9px;background:#162739;border-radius:8px;margin-top:8px;overflow:hidden}.fill{height:100%;width:0;background:#46d9ef;transition:width .08s linear}.watch{margin-top:15px;background:#02060b;border-radius:14px;overflow:hidden;border:1px solid #20364a}.watch video{width:100%;display:block;background:#000;max-height:620px}.watch .watch-title{padding:10px 12px;color:#9eb5c8;font-weight:700}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}.actions button{width:100%}}</style></head><body><main><h1>✦ ANTENEH AI STUDIO</h1><p>Any subject → visual educational video. Local generation • no API key.</p><section class="panel"><textarea id="topic" placeholder="Enter any topic or full lesson script..."></textarea><div class="grid"><label>Length<select id="length"><option value="60">60 seconds</option><option value="90" selected>90 seconds</option><option value="120">2 minutes</option><option value="300">5 minutes</option></select></label><label>Style<select id="style"><option>Clean explainer</option><option>Whiteboard</option><option>Modern presentation</option><option>Minimal motion graphics</option></select></label><label>Ratio<select id="ratio"><option>16:9</option><option>9:16</option><option>1:1</option><option>4:5</option><option>21:9</option></select></label><label>Visual intelligence<select id="mode"><option>Auto</option><option>Diagram focused</option><option>Process focused</option><option>Presentation focused</option></select></label></div><div class="actions"><button class="primary" id="generate">Generate Video ▶</button><button id="preview">Preview Storyboard</button><button id="save">Save</button><button id="restore">Restore</button></div><div id="status" class="status">Ready.</div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="panel"><canvas id="canvas"></canvas><div id="watch" class="watch" hidden><div class="watch-title">▶ Watch your generated video before downloading</div><video id="videoPreview" controls playsinline preload="metadata"></video></div><a id="download" hidden style="display:inline-block;margin-top:12px;background:white;color:#06101a;padding:11px 15px;border-radius:9px;font-weight:800">Download video</a><div id="scenes"></div></section></main><script>(()=>{const $=x=>document.getElementById(x),topic=$("topic"),len=$("length"),style=$("style"),ratio=$("ratio"),mode=$("mode"),gen=$("generate"),prev=$("preview"),save=$("save"),restore=$("restore"),status=$("status"),fill=$("fill"),c=$("canvas"),x=c.getContext("2d"),dl=$("download"),list=$("scenes"),watch=$("watch"),video=$("videoPreview");let scenes=[],timer=0,busy=false;const FPS=8;function size(){return ({"16:9":[1280,720],"9:16":[720,1280],"1:1":[1080,1080],"4:5":[864,1080],"21:9":[1260,540]})[ratio.value]}function make(t){let p=t.trim().split(/(?<=[.!?])\s+|\n+/).map(s=>s.trim()).filter(Boolean);if(p.length<3){let s=t.trim().replace(/[?.!]$/,"");p=[`What is ${s}?`,`How does ${s} work?`,`What are the main ideas of ${s}?`,`Why does ${s} matter?`,`What is an example of ${s}?`,`Key takeaway: ${s}.`]}return p.slice(0,12).map((text,i)=>({title:i===0?"The big question":i===p.length-1?"Key takeaway":"Key idea "+(i+1),text,image:null,imageReady:false}))}function visualPrompt(s){let t=(topic.value+" "+s.text).replace(/\s+/g," ").slice(0,500);let type=mode.value==="Auto"?"clear educational infographic with accurate labeled visual relationships":mode.value.toLowerCase();let styleHint=style.value==="Whiteboard"?"clean hand-drawn whiteboard illustration":style.value==="Modern presentation"?"premium modern presentation graphic":style.value==="Minimal motion graphics"?"minimal vector motion-graphics frame":"clean educational explainer infographic";return `${styleHint}, ${type}. Topic: ${t}. Scene title: ${s.title}. Make the visual directly explain the topic, not a generic abstract image. Show concrete objects, arrows, labels and cause/effect or sequence when appropriate. No paragraphs, no watermark, no decorative filler. High contrast, classroom-ready, 16:9.`}function aiUrl(s){return "https://image.pollinations.ai/prompt/"+encodeURIComponent(visualPrompt(s))+"?width=1280&height=720&nologo=true&enhance=true&seed="+Math.floor(Math.random()*1000000)}function loadImage(s){return new Promise(resolve=>{let img=new Image();img.crossOrigin="anonymous";img.onload=()=>{s.image=img;s.imageReady=true;resolve(img)};img.onerror=()=>resolve(null);img.src=aiUrl(s)})}async function prepareVisuals(){status.textContent="Creating AI visuals… 0%";for(let i=0;i<scenes.length;i++){await loadImage(scenes[i]);let p=Math.round((i+1)/scenes.length*100);status.textContent=`Creating AI visuals… ${p}%`;fill.style.width=p+"%"}return scenes.some(s=>s.imageReady)}function setup(){if(!topic.value.trim()){status.textContent="Please enter a topic or script.";return false}clearTimeout(timer);scenes=make(topic.value);let d=size();c.width=d[0];c.height=d[1];list.innerHTML=scenes.map((s,i)=>`<p><b>${i+1}. ${s.title}</b> — ${s.text}</p>`).join("");fill.style.width="0%";draw(scenes[0],0);return true}function draw(s,t){let w=c.width,h=c.height;x.fillStyle="#06111c";x.fillRect(0,0,w,h);if(s.imageReady&&s.image){try{let iw=s.image.naturalWidth,ih=s.image.naturalHeight,sc=Math.max(w/iw,h/ih),dw=iw*sc,dh=ih*sc;x.globalAlpha=.96;x.drawImage(s.image,(w-dw)/2,(h-dh)/2,dw,dh);x.globalAlpha=1;x.fillStyle="rgba(0,0,0,.34)";x.fillRect(0,0,w,h)}catch(e){s.imageReady=false}}x.fillStyle="#61e3ff";x.font="900 "+Math.max(24,w/30)+"px system-ui";x.fillText(s.title,w*.07,h*.12);x.fillStyle="#fff";x.font="600 "+Math.max(18,w/62)+"px system-ui";let line="",y=h*.22,fs=Math.max(18,w/62);for(const word of s.text.split(/\s+/)){let n=line?line+" "+word:word;if(x.measureText(n).width>w*.8&&line){x.fillText(line,w*.07,y);y+=fs*1.45;line=word}else line=n}if(line)x.fillText(line,w*.07,y);let r=Math.min(w,h)*.13*(1+.04*Math.sin(t/350)),cx=w/2,cy=h*.75;x.fillStyle="#102d43";x.strokeStyle="#49ddf6";x.lineWidth=4;x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.fill();x.stroke();x.fillStyle="#fff";x.textAlign="center";x.font="900 "+Math.max(17,w/55)+"px system-ui";x.fillText(mode.value==="Auto"?"AI VISUAL":mode.value.toUpperCase(),cx,cy+7);x.textAlign="left";x.fillStyle="#91aabd";x.font="700 12px system-ui";x.fillText(style.value.toUpperCase()+" • "+ratio.value,w*.07,h*.92)}function play(ms,done,label){let start=performance.now(),each=ms/scenes.length,interval=Math.max(50,1000/FPS);function f(){let now=performance.now(),e=now-start,p=Math.min(100,e/ms*100),i=Math.min(scenes.length-1,Math.floor(e/each));draw(scenes[i],now);fill.style.width=p.toFixed(1)+"%";status.textContent=label+" "+Math.floor(p)+"%";if(e<ms)timer=setTimeout(f,interval);else{clearTimeout(timer);fill.style.width="100%";status.textContent=label+" 100%";done()}}f()}prev.onclick=async()=>{if(busy||!setup())return;busy=true;gen.disabled=true;prev.disabled=true;await prepareVisuals();status.textContent="Preview playing 0%";play(Math.min(15000,+len.value*1000),()=>{busy=false;gen.disabled=false;prev.disabled=false;status.textContent="Preview complete."},"Preview")};gen.onclick=async()=>{if(busy||!setup())return;if(!c.captureStream||!window.MediaRecorder){status.textContent="Video export is not supported by this browser. Use Chrome/Chromium.";return}busy=true;gen.disabled=true;prev.disabled=true;dl.hidden=true;watch.hidden=true;fill.style.width="0%";await prepareVisuals();status.textContent="Generating video 0%";let total=+len.value*1000,stream=c.captureStream(FPS),mime=MediaRecorder.isTypeSupported("video/webm;codecs=vp9")?"video/webm;codecs=vp9":MediaRecorder.isTypeSupported("video/webm;codecs=vp8")?"video/webm;codecs=vp8":"video/webm",rec;try{rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:1400000})}catch(e){rec=new MediaRecorder(stream)}let chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};rec.onerror=()=>{clearTimeout(timer);status.textContent="Video recording failed. Try Chrome/Chromium.";busy=false;gen.disabled=false;prev.disabled=false};rec.onstop=()=>{clearTimeout(timer);let blob=new Blob(chunks,{type:"video/webm"}),url=URL.createObjectURL(blob);video.src=url;watch.hidden=false;dl.href=url;dl.download="anteneh-ai-studio-video.webm";dl.hidden=false;status.textContent="Video ready — 100% • watch it above, then download.";busy=false;gen.disabled=false;prev.disabled=false};rec.start();play(total,()=>setTimeout(()=>rec.stop(),120),"Generating video")};save.onclick=()=>{localStorage.setItem("anteneh-ai-studio-project",JSON.stringify({topic:topic.value,length:len.value,style:style.value,ratio:ratio.value,mode:mode.value}));status.textContent="Project saved on this device."};restore.onclick=()=>{try{let p=JSON.parse(localStorage.getItem("anteneh-ai-studio-project")||"null");if(!p){status.textContent="No saved project found.";return}topic.value=p.topic||"";len.value=p.length||"90";style.value=p.style||style.value;ratio.value=p.ratio||ratio.value;mode.value=p.mode||mode.value;setup();status.textContent="Project restored."}catch(e){status.textContent="Could not restore saved project."}};ratio.onchange=()=>{if(topic.value.trim())setup()}})();</script></body></html>
