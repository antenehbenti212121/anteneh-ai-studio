e.value.toUpperCase()+" • "+ratio.value,w*.06,h*.96)}function setup(){if(!topic.value.trim()){status.textContent="Please enter a topic or script.";return false}clearTimeout(timer);scenes=make(topic.value);let d=size();c.width=d[0];c.height=d[1];list.innerHTML=scenes.map((s,i)=>`<p><b>${i+1}. ${s.title}</b> — ${s.type} — ${s.text}</p>`).join("");fill.style.width="0%";visual(scenes[0],0);return true}function play(ms,done,label){let start=performance.now(),each=ms/scenes.length,interval=Math.max(30,1000/FPS);function f(){let now=performance.now(),e=now-start,p=Math.min(100,e/ms*100),i=Math.min(scenes.length-1,Math.floor(e/each));visual(scenes[i],now);fill.style.width=p.toFixed(1)+"%";status.textContent=label+" "+Math.floor(p)+"%";if(e<ms)timer=setTimeout(f,interval);else{clearTimeout(timer);fill.style.width="100%";done()}}f()}prev.onclick=()=>{if(busy||!setup())return;busy=true;gen.disabled=prev.disabled=true;status.textContent="Preview playing 0%";play(Math.min(15000,+len.value*1000),()=>{busy=false;gen.disabled=prev.disabled=false;status.textContent="Preview complete."},"Preview")};gen.onclick=()=>{if(busy||!setup())return;if(!c.captureStream||!window.MediaRecorder){status.textContent="Video export is not supported by this browser. Use Chrome/Chromium.";return}busy=true;gen.disabled=prev.disabled=true;dl.hidden=true;watch.hidden=true;fill.style.width="0%";status.textContent="Generating your educational video 0%";let total=+len.value*1000,stream=c.captureStream(FPS),mime=MediaRecorder.isTypeSupported("video/webm;codecs=vp9")?"video/webm;codecs=vp9":MediaRecorder.isTypeSupported("video/webm;codecs=vp8")?"video/webm;codecs=vp8":"video/webm",rec;try{rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:2200000})}catch(e){rec=new MediaRecorder(stream)}let chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};rec.onerror=()=>{clearTimeout(timer);busy=false;gen.disabled=prev.disabled=false;status.textContent="Video recording failed. Try Chro
