<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANTENEH AI STUDIO</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050a12;color:#f5f9ff;font:15px system-ui,sans-serif}header{padding:14px 5%;border-bottom:1px solid #20364b;position:sticky;top:0;background:#07111ef5;z-index:5}.bar,main{max-width:1200px;margin:auto}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{border:1px solid #27546c;border-radius:99px;padding:6px 10px;color:#6ee5ff;font-size:11px}.wrap{padding:30px 5% 70px}.hero h1{font-size:clamp(40px,7vw,74px);line-height:.92;margin:14px 0}.muted{color:#92a8bd;line-height:1.55}.panel{margin-top:18px;padding:20px;border:1px solid #20374e;border-radius:22px;background:#0a1420}label{font-size:11px;font-weight:800;color:#bfd1e1;display:block;margin:8px 0 6px}textarea,select,button{font:inherit}textarea,select{width:100%;background:#07111c;color:#fff;border:1px solid #29435c;border-radius:12px;padding:12px}textarea{min-height:150px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.actions,.tools{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.btn{padding:13px 17px;border-radius:12px;border:1px solid #29435c;background:#102337;color:#fff;font-weight:900;cursor:pointer}.btn:disabled{opacity:.5;cursor:wait}.primary{border:0;background:linear-gradient(135deg,#8758f5,#31d9ef)}.mini{padding:9px 12px;font-size:12px}.hint{font-size:11px;color:#7690a6;margin-top:10px}.barx{height:7px;background:#142437;border-radius:9px;margin-top:12px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#8758f5,#31d9ef);transition:width .1s}#output{display:none}.stage{margin-top:15px;background:#02060b;border:1px solid #294159;border-radius:18px;overflow:hidden}.stage canvas{display:block;width:100%;height:auto}.meta{display:flex;justify-content:space-between;gap:10px;color:#8fa6ba;font-size:12px}.download{display:inline-block;margin-top:13px;padding:12px 16px;background:#fff;color:#06101a;border-radius:11px;font-weight:900;text-decoration:none}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:14px}.card{padding:13px;border:1px solid #20374e;border-radius:14px;background:#091521;cursor:pointer}.card.active{border-color:#55def7}.card small{display:block;color:#63def7;text-transform:uppercase;margin-top:4px}.card p{color:#91a7ba;font-size:12px;line-height:1.45;margin-bottom:0}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.cards{grid-template-columns:1fr}.actions{display:grid}.actions .btn{width:100%}.wrap{padding:24px 12px 55px}}
</style>
</head>
<body>
<header><div class="bar"><b>✦ ANTENEH AI STUDIO</b><span class="pill">LOCAL • NO API KEY</span></div></header>
<main class="wrap">
<section class="hero"><span class="pill">EDUCATIONAL VIDEO STUDIO</span><h1>Any subject.<br><span style="color:#61e3ff">Make the idea move.</span></h1><p class="muted">Turn any topic or full lesson into a visual educational video directly in your browser.</p></section>
<section class="panel">
<label for="input">TOPIC OR FULL SCRIPT</label>
<textarea id="input" placeholder="Enter any subject or paste a complete lesson..."></textarea>
<div class="grid">
<div><label>LENGTH</label><select id="duration"><option value="60">60 seconds</option><option value="90" selected>90 seconds</option><option value="120">2 minutes</option><option value="300">5 minutes</option></select></div>
<div><label>VISUAL STYLE</label><select id="style"><option>Clean explainer</option><option>Whiteboard</option><option>Modern presentation</option><option>Minimal motion graphics</option></select></div>
<div><label>ASPECT RATIO</label><select id="ratio"><option>16:9</option><option>9:16</option><option>1:1</option><option>4:5</option><option>21:9</option></select></div>
<div><label>VISUAL INTELLIGENCE</label><select id="mode"><option>Auto</option><option>Diagram focused</option><option>Process focused</option><option>Presentation focused</option></select></div>
</div>
<div class="actions"><button class="btn primary" id="generate">Generate Video ▶</button><button class="btn" id="preview">Preview Storyboard</button></div>
<div class="tools"><button class="btn mini" id="save">Save Project</button><button class="btn mini" id="restore">Restore Saved</button><button class="btn mini" id="exportProject">Export Project</button></div>
<div class="hint">Fast local generation. No account, API key, upload, or paid service required.</div>
<div id="status" class="muted" style="margin-top:8px">Ready.</div><div class="barx"><div id="fill" class="fill"></div></div>
</section>
<section id="output" class="panel"><div class="meta"><b id="lesson">Lesson</b><span id="info"></span></div><div class="stage"><canvas id="canvas"></canvas></div><a id="download" class="download" hidden>Download video</a><div id="cards" class="cards"></div></section>
</main>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),I=$('input'),D=$('duration'),R=$('ratio'),S=$('style'),M=$('mode'),G=$('generate'),P=$('preview'),O=$('output'),C=$('canvas'),X=C.getContext('2d'),F=$('fill'),T=$('status'),L=$('lesson'),N=$('info'),A=$('cards'),DL=$('download');
let scenes=[],active=0,raf=0,recording=false;
const KEY='anteneh-ai-studio-project-v6',FPS=12;
function stop(){if(raf)cancelAnimationFrame(raf);raf=0}
function classify(s){let q=s.toLowerCase();if(/[→=+]|formula|equation|calculate/.test(q))return'Formula';if(/because|cause|effect|impact|result|leads|increase|decrease|why/.test(q))return'Cause & effect';if(/compare|versus|difference|similar|unlike|whereas/.test(q))return'Comparison';if(/first|then|next|step|process|how .*work|moves|changes/.test(q))return'Process';if(/cycle|repeat|loop/.test(q))return'Cycle';if(/year|century|history|before|after|ancient|future/.test(q))return'Timeline';if(/if |when |choose|decision|condition|otherwise/.test(q))return'Decision flow';if(/example|for instance|such as/.test(q))return'Example';if(/warning|danger|risk|avoid|important/.test(q))return'Warning';if(/summary|recap|remember|takeaway|key idea/.test(q))return'Recap';return'Concept'}
function split(text){let p=text.trim().split(/(?<=[.!?])\s+|\n+/).map(x=>x.trim()).filter(x=>x.length>2);if(p.length<3){let s=text.trim().replace(/^(explain|teach me|what is|how does|how do|describe)\s+/i,'').replace(/[?.!]$/,'');p=[`What is ${s}?`,`What are the main ideas of ${s}?`,`How does ${s} work?`,`Why does ${s} matter?`,`What is an example of ${s}?`,`What should we remember about ${s}?`]}return p.slice(0,14)}
function make(text){let p=split(text),last=p.length-1;return p.map((text,i)=>({title:i===0?'The big question':i===last?'Key takeaway':'Key idea '+(i),text,type:classify(text)}))}
function resize(){let z=({'16:9':[1280,720],'9:16':[720,1280],'1:1':[1080,1080],'4:5':[864,1080],'21:9':[1260,540]})[R.value]||[1280,720];C.width=z[0];C.height=z[1]}
function wrap(text,x,y,size,max){X.font='700 '+size+'px system-ui';let line='',lines=[];for(let word of text.split(/\s+/)){let n=line?line+' '+word:word;if(X.measureText(n).width>max&&line){lines.push(line);line=word}else line=n}if(line)lines.push(line);for(let v of lines.slice(0,5)){X.fillText(v,x,y);y+=size*1.35}}
function box(x,y,w,h,label){X.fillStyle='#10283b';X.strokeStyle='#49ddf6';X.lineWidth=3;X.beginPath();X.roundRect(x,y,w,h,18);X.fill();X.stroke();X.fillStyle='#fff';X.font='900 '+Math.max(14,w/24)+'px system-ui';X.textAlign='center';X.fillText(label,x+w/2,y+h/2+6);X.textAlign='left'}
function draw(s,time){let w=C.width,h=C.height;X.fillStyle='#06111c';X.fillRect(0,0,w,h);X.strokeStyle='#ffffff0b';X.lineWidth=1;for(let x=0;x<w;x+=Math.max(50,w/14)){X.beginPath();X.moveTo(x,0);X.lineTo(x,h);X.stroke()}X.fillStyle='#fff';X.font='900 '+Math.max(25,w/30)+'px system-ui';X.fillText(s.title,w*.07,h*.12);X.fillStyle='#a9bdcf';wrap(s.text,w*.07,h*.19,Math.max(15,w/66),w*.82);let cx=w/2,cy=h*.58,u=Math.min(w,h)*.17,pulse=Math.sin(time/350)*5;X.lineWidth=4;X.strokeStyle='#49ddf6';
if(s.type==='Process'||s.type==='Formula'){box(cx-u*2,cy+pulse,u*1.45,u*.72,'INPUT');box(cx-u*.72,cy,u*1.45,u*.72,'TRANSFORM');box(cx+.56*u,cy-pulse,u*1.45,u*.72,'RESULT');X.beginPath();X.moveTo(cx-u*.55,cy+u*.36);X.lineTo(cx-u*.72,cy+u*.36);X.stroke();X.beginPath();X.moveTo(cx+.73*u,cy+u*.36);X.lineTo(cx+.56*u,cy+u*.36);X.stroke()}
else if(s.type==='Cause & effect'){box(cx-u*1.9,cy,u*2,u*.8,'CAUSE');box(cx+.05*u,cy,u*2,u*.8,'EFFECT');X.beginPath();X.moveTo(cx+.1*u,cy+.4*u);X.lineTo(cx+.05*u,cy+.4*u);X.stroke()}
else if(s.type==='Comparison'){box(cx-u*2,cy,u*2.1,u*1.25,'A');box(cx+.1*u,cy,u*2.1,u*1.25,'B');X.fillStyle='#fff';X.font='800 16px system-ui';X.fillText('COMPARE • CONTRAST',cx-u*1.2,cy+u*1.65)}
else if(s.type==='Cycle'){for(let i=0;i<4;i++){let a=i*Math.PI/2+time/1800;box(cx+Math.cos(a)*u*1.55-u*.55,cy+Math.sin(a)*u*1.55-u*.27,u*1.1,u*.54,'STEP '+(i+1))}}
else if(s.type==='Timeline'){X.beginPath();X.moveTo(cx-u*2.2,cy);X.lineTo(cx+u*2.2,cy);X.stroke();for(let i=0;i<5;i++){let xx=cx-u*2.2+i*u*1.1;X.fillStyle='#49ddf6';X.beginPath();X.arc(xx,cy,8,0,Math.PI*2);X.fill();X.fillStyle='#fff';X.font='800 13px system-ui';X.fillText('T'+(i+1),xx-9,cy+31)}}
else if(s.type==='Decision flow'){box(cx-u*1.8,cy,u*2,u*.7,'QUESTION');box(cx+.8*u,cy-u*.95,u*1.45,u*.6,'YES');box(cx+.8*u,cy+u*.95,u*1.45,u*.6,'NO')}
else if(s.type==='Warning'){box(cx-u*1.3,cy,u*2.6,u*1.1,'IMPORTANT')}
else if(s.type==='Recap'){box(cx-u*1.5,cy,u*3,u*.9,'REMEMBER')}
else {let r=u*(1+Math.sin(time/350)*.05);X.fillStyle='#18354a';X.beginPath();X.arc(cx,cy,r,0,Math.PI*2);X.fill();X.stroke();X.fillStyle='#fff';X.textAlign='center';X.font='900 '+Math.max(18,w/42)+'px system-ui';X.fillText(s.type.toUpperCase(),cx,cy+7);X.textAlign='left'}
X.fillStyle='#55def7';X.font='800 11px system-ui';X.fillText(S.value.toUpperCase()+' • '+M.value.toUpperCase(),w*.07,h*.91)}
function cards(){A.innerHTML=scenes.map((s,i)=>`<div class="card ${i===active?'active':''}" data-i="${i}"><b>${i+1}. ${s.title}</b><small>${s.type}</small><p>${s.text}</p></div>`).join('');A.querySelectorAll('.card').forEach(e=>e.onclick=()=>{stop();active=Number(e.dataset.i);cards();draw(scenes[active],0)})}
function setup(){stop();if(!I.value.trim()){T.textContent='Enter a topic or script first.';return false}scenes=make(I.value);active=0;resize();O.style.display='block';L.textContent=I.value.trim().replace(/\s+/g,' ').slice(0,70);N.textContent=`${scenes.length} scenes • ${R.value} • ${D.value}s`;F.style.width='0%';cards();draw(scenes[0],0);return true}
function project(){return{version:6,topic:I.value.trim(),duration:Number(D.value),style:S.value,ratio:R.value,mode:M.value,scenes}}
function apply(p){if(!p)return;I.value=p.topic||'';if(p.duration)D.value=String(p.duration);if(p.style)S.value=p.style;if(p.ratio)R.value=p.ratio;if(p.mode)M.value=p.mode;if(I.value)setup();T.textContent='Project restored locally.'}
P.onclick=()=>{if(!setup())return;T.textContent='Storyboard preview playing…';let start=performance.now(),each=Math.max(1200,Number(D.value)*1000/scenes.length);function loop(now){let elapsed=now-start;active=Math.min(scenes.length-1,Math.floor(elapsed/each));draw(scenes[active],now);if(elapsed<each*scenes.length){F.style.width=Math.min(100,elapsed/(each*scenes.length)*100)+'%';raf=requestAnimationFrame(loop)}else{raf=0;F.style.width='100%';cards();T.textContent='Storyboard preview complete.'}}raf=requestAnimationFrame(loop)};
G.onclick=async()=>{if(recording||!setup())return;if(!C.captureStream||!window.MediaRecorder){T.textContent='Video export is not supported in this browser. Use Preview Storyboard instead.';return}recording=true;G.disabled=true;P.disabled=true;DL.hidden=true;T.textContent='Generating video… keep this page open.';let total=Number(D.value)*1000,each=total/scenes.length,start=performance.now(),stream=C.captureStream(FPS),mime='video/webm';if(MediaRecorder.isTypeSupported('video/webm;codecs=vp9'))mime='video/webm;codecs=vp9';else if(MediaRecorder.isTypeSupported('video/webm;codecs=vp8'))mime='video/webm;codecs=vp8';let rec;try{rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:Math.min(2800000,Math.max(700000,Math.round(C.width*C.height*1.25)))})}catch(e){try{rec=new MediaRecorder(stream)}catch(err){recording=false;G.disabled=false;P.disabled=false;T.textContent='This browser could not start video recording.';return}}let chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};rec.onerror=()=>{stop();recording=false;G.disabled=false;P.disabled=false;T.textContent='Video recording stopped because the browser reported an error.'};rec.onstop=()=>{stop();recording=false;G.disabled=false;P.disabled=false;stream.getTracks().forEach(t=>t.stop());if(!chunks.length){T.textContent='No video data was produced. Try Preview Storyboard or another browser.';return}let blob=new Blob(chunks,{type:'video/webm'}),url=URL.createObjectURL(blob);DL.href=url;DL.download='anteneh-ai-studio-video.webm';DL.hidden=false;T.textContent='Video ready — tap Download video.';F.style.width='100%'};try{rec.start(250)}catch(e){recording=false;G.disabled=false;P.disabled=false;T.textContent='Could not start recording in this browser.';return}function frame(now){if(!recording)return;let elapsed=now-start;active=Math.min(scenes.length-1,Math.floor(elapsed/each));draw(scenes[active],now);F.style.width=Math.min(100,elapsed/total*100)+'%';if(elapsed<total)raf=requestAnimationFrame(frame);else{draw(scenes[scenes.length-1],now);setTimeout(()=>{if(rec.state!=='inactive')rec.stop()},80)}}raf=requestAnimationFrame(frame)};
$('save').onclick=()=>{try{localStorage.setItem(KEY,JSON.stringify(project()));T.textContent='Project saved on this device.'}catch(e){T.textContent='Could not save locally.'}};
$('restore').onclick=()=>{try{let p=JSON.parse(localStorage.getItem(KEY)||'null');if(p)apply(p);else T.textContent='No saved project found on this device.'}catch(e){T.textContent='Saved project could not be restored.'}};
$('exportProject').onclick=()=>{let blob=new Blob([JSON.stringify(project(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='anteneh-ai-studio-project.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);T.textContent='Project JSON exported.'};
R.onchange=()=>{if(I.value.trim())setup()};
window.addEventListener('beforeunload',stop);
})();
</script>
</body>
</html>
