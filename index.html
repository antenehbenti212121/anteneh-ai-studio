<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANTENEH AI STUDIO</title><style>
:root{--bg:#050a12;--panel:#0b1622;--line:#23405a;--text:#eef7ff;--muted:#9eb5c8;--accent:#7657ed;--cyan:#46d9ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui;padding:18px}main{max-width:1000px;margin:auto}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin:15px 0}textarea,select,button{font:inherit}textarea,select{width:100%;background:#07111c;color:#fff;border:1px solid #29435c;border-radius:10px;padding:11px}textarea{min-height:130px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}button{padding:12px 16px;border:0;border-radius:10px;background:#17314a;color:#fff;font-weight:800;cursor:pointer}button.primary{background:var(--accent)}button:disabled{opacity:.5;cursor:wait}canvas{width:100%;height:auto;display:block;background:#02060b;border-radius:14px;margin-top:15px}.status{color:var(--muted);margin-top:10px;font-weight:700}.bar{height:9px;background:#162739;border-radius:8px;margin-top:8px;overflow:hidden}.fill{height:100%;width:0;background:var(--cyan);transition:width .08s}.watch{margin-top:15px;background:#02060b;border-radius:14px;overflow:hidden;border:1px solid #20364a}.watch video{width:100%;display:block;max-height:620px}.watch-title{padding:10px 12px;color:var(--muted);font-weight:700}.scene{margin:10px 0;padding:12px;border:1px solid #20364a;border-radius:12px;background:#07111c}.scene b{color:#62e6ff}.scene small{display:block;color:#7f9aad;margin-top:4px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.pill{border:1px solid #29435c;border-radius:999px;padding:5px 9px;color:#9eb5c8;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}.actions button{width:100%}}
</style></head><body><main><h1>✦ ANTENEH AI STUDIO</h1><p>Any subject → visual educational video. Local generation • no API key.</p><section class="panel"><textarea id="topic" placeholder="Enter any topic or full lesson script..."></textarea><div class="grid"><label>Length<select id="length"><option value="60">60 seconds</option><option value="90" selected>90 seconds</option><option value="120">2 minutes</option><option value="300">5 minutes</option></select></label><label>Style<select id="style"><option>Clean explainer</option><option>Whiteboard</option><option>Modern presentation</option><option>Minimal motion graphics</option></select></label><label>Ratio<select id="ratio"><option>16:9</option><option>9:16</option><option>1:1</option><option>4:5</option><option>21:9</option></select></label><label>Visual intelligence<select id="mode"><option>Auto</option><option>Diagram focused</option><option>Process focused</option><option>Presentation focused</option></select></label></div><div class="actions"><button class="primary" id="generate">Generate Video ▶</button><button id="preview">Preview Storyboard</button><button id="save">Save</button><button id="restore">Restore</button></div><div id="status" class="status">Ready.</div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="panel"><canvas id="canvas"></canvas><div id="watch" class="watch" hidden><div class="watch-title">▶ Watch your generated video before downloading</div><video id="video" controls playsinline></video></div><a id="download" hidden style="display:inline-block;margin-top:12px;background:white;color:#06101a;padding:11px 15px;border-radius:9px;font-weight:800">Download video</a><div id="scenes"></div></section></main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id);const topic=$("topic"),length=$("length"),style=$("style"),ratio=$("ratio"),mode=$("mode"),generate=$("generate"),preview=$("preview"),save=$("save"),restore=$("restore"),status=$("status"),fill=$("fill"),canvas=$("canvas"),ctx=canvas.getContext('2d'),sceneBox=$("scenes"),watch=$("watch"),video=$("video"),download=$("download");
let scenes=[],recording=false,url='';
const palette=['#4dd7ff','#a78bfa','#62e6a7','#ffcf66','#ff7f9b'];
const stop=new Set('a an the and or but for from with into onto about this that these those is are was were be been to of in on at by as it its their they them he she we you your our can could should would will may might do does did how what why when where which who than then also very more most some many much each other another between through during after before because while if so such not no yes have has had'.split(/\s+/));
function dims(){return({'16:9':[1280,720],'9:16':[720,1280],'1:1':[1080,1080],'4:5':[864,1080],'21:9':[1260,540]})[ratio.value]||[1280,720]}
function words(s){return String(s).replace(/[^A-Za-z0-9%+→=/'’-]+/g,' ').split(/\s+/).filter(w=>w.length>2&&!stop.has(w.toLowerCase()))}
function keys(s){return [...new Set(words(s))].slice(0,8)}
function split(s){const raw=String(s).trim();let p=raw.split(/\n+|[.!?]+\s*/).map(v=>v.trim()).filter(Boolean);if(p.length<3){const b=raw.replace(/[.!?]$/,'');p=[`What is ${b}?`,`How does ${b} work?`,`What are the main ideas of ${b}?`,`Why does ${b} matter?`,`An example of ${b}.`,`Key takeaway: ${b}.`]}return p}
function type(s,i,n){const q=s.toLowerCase();if(/[=→+%]/.test(s)||/formula|equation|calculate|equals/.test(q))return'formula';if(/compare|versus|\bvs\b|difference|similar|unlike|both|whereas/.test(q))return'comparison';if(/first|then|next|finally|step|process|procedure|cycle|how .*\bwork\b/.test(q))return'process';if(/cause|because|therefore|leads to|results? in|effect|why /.test(q))return'cause';if(/example|for instance|such as|e\.g\./.test(q))return'example';if(/warning|avoid|mistake|misconception|danger|careful|risk/.test(q))return'warning';if(/timeline|history|year|century|before|after|era|founded|born/.test(q))return'timeline';if(/if |then |otherwise|decision|choose|yes|no/.test(q))return'decision';if(i===n-1)return'recap';return i===0?'concept':'concept'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function build(){const raw=topic.value.trim();if(!raw){status.textContent='Please enter a topic or script.';return false}const count=+length.value<=60?6:+length.value<=90?7:+length.value<=120?8:12;const parts=split(raw).slice(0,count);scenes=parts.map((text,i)=>({id:i,text,title:i===0?'The big question':i===parts.length-1?'Key takeaway':(keys(text)[0]||`Key idea ${i+1}`),type:type(text,i,parts.length),keys:keys(text)}));const d=dims();canvas.width=d[0];canvas.height=d[1];sceneBox.innerHTML=scenes.map((s,i)=>`<div class="scene"><b>${i+1}. ${esc(s.title)}</b><div class="meta"><span class="pill">${s.type}</span>${s.keys.slice(0,4).map(k=>`<span class="pill">${esc(k)}</span>`).join('')}</div><small>${esc(s.text)}</small></div>`).join('');draw(scenes[0],0);return true}
function rounded(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}
function box(x,y,w,h,label,color,scale=1){ctx.fillStyle='rgba(8,24,38,.96)';ctx.strokeStyle=color;ctx.lineWidth=3;rounded(x,y,w,h,18);ctx.fill();ctx.stroke();let fs=Math.max(18,Math.min(42,w/10))*scale;ctx.fillStyle='#fff';ctx.font=`800 ${fs}px system-ui`;ctx.textAlign='center';ctx.fillText(label,x+w/2,y+h/2+fs*.32);ctx.textAlign='left'}
function text(t,x,y,size,align='left',color='#fff',weight=800){ctx.fillStyle=color;ctx.font=`${weight} ${size}px system-ui`;ctx.textAlign=align;ctx.fillText(t,x,y);ctx.textAlign='left'}
function wrap(t,max){const out=[];let line='';String(t).split(/\s+/).forEach(w=>{const test=line?line+' '+w:w;if(ctx.measureText(test).width>max&&line){out.push(line);line=w}else line=test});if(line)out.push(line);return out}
function arrow(x1,y1,x2,y2,alpha=1){ctx.globalAlpha=alpha;ctx.strokeStyle='#fff';ctx.fillStyle='#fff';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();const a=Math.atan2(y2-y1,x2-x1);ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-18*Math.cos(a-.55),y2-18*Math.sin(a-.55));ctx.lineTo(x2-18*Math.cos(a+.55),y2-18*Math.sin(a+.55));ctx.fill();ctx.globalAlpha=1}
function bg(w,h,t){ctx.fillStyle='#06111c';ctx.fillRect(0,0,w,h);const g=ctx.createRadialGradient(w*.72,h*.18,0,w*.72,h*.18,Math.max(w,h)*.72);g.addColorStop(0,'#153c5b');g.addColorStop(1,'#06111c');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);if(style.value==='Whiteboard'){ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;for(let x=0;x<w;x+=45){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}}else{ctx.strokeStyle='rgba(77,215,255,.08)';ctx.lineWidth=2;const off=(t*.03)%80;for(let x=-h;x<w+h;x+=80){ctx.beginPath();ctx.moveTo(x+off,0);ctx.lineTo(x+h+off,h);ctx.stroke()}}}
function draw(s,t){if(!s)return;const w=canvas.width,h=canvas.height,phase=t*.002;bg(w,h,t);const accent=palette[s.id%palette.length];text(s.title,w*.06,h*.10,Math.max(25,w/30),'left','#62e6ff',900);text(`${s.type.toUpperCase()} • SCENE ${s.id+1}/${scenes.length}`,w*.06,h*.155,Math.max(12,w/90),'left','#91aabd',700);const k=s.keys.length?s.keys:[s.title];
if(s.type==='process'||s.type==='formula'){const a=Math.min(k.length,5),gap=w*.025,b=(w*.82-gap*(a-1))/a,y=h*.38,slide=(phase%1)*12;k.slice(0,a).forEach((v,i)=>{const x=w*.09+i*(b+gap),yy=y+Math.sin(phase*2+i)*9;box(x,yy,b,h*.22,v,palette[i%palette.length],.92);if(i<a-1)arrow(x+b+4,yy+h*.11,x+b+gap-4,y+h*.11)})}
else if(s.type==='comparison'){box(w*.07,h*.34,w*.36,h*.29,k[0]||'A',palette[0]);box(w*.57,h*.34,w*.36,h*.29,k[1]||'B',palette[1]);text('VS',w*.50,h*.51,Math.max(20,w/42),'center','#fff',900);arrow(w*.43,h*.50,w*.47,h*.50);arrow(w*.53,h*.50,w*.57,h*.50)}
else if(s.type==='cause'){box(w*.07,h*.36,w*.30,h*.25,k[0]||'Cause',palette[0]);box(w*.63,h*.36,w*.30,h*.25,k[1]||'Effect',palette[1]);arrow(w*.39,h*.485,w*.61,h*.485)}
else if(s.type==='timeline'){const y=h*.52,x0=w*.10,x1=w*.90;ctx.strokeStyle=accent;ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke();k.slice(0,6).forEach((v,i)=>{const x=x0+(x1-x0)*(i/Math.max(1,Math.min(k.length,6)-1));ctx.fillStyle=palette[i%5];ctx.beginPath();ctx.arc(x,y,14+5*Math.sin(phase+i),0,Math.PI*2);ctx.fill();box(Math.max(5,x-w*.08),y-h*.25,w*.16,h*.16,v,palette[i%5],.72)})}
else if(s.type==='decision'){box(w*.33,h*.34,w*.34,h*.20,k[0]||'Decision',accent);arrow(w*.50,h*.54,w*.30,h*.68);arrow(w*.50,h*.54,w*.70,h*.68);box(w*.14,h*.68,w*.32,h*.14,k[1]||'YES',palette[2],.7);box(w*.54,h*.68,w*.32,h*.14,k[2]||'NO',palette[4],.7)}
else if(s.type==='example'||s.type==='warning'){text(s.type==='warning'?'WATCH FOR THIS':'REAL EXAMPLE',w*.08,h*.31,Math.max(20,w/48),'left',s.type==='warning'?palette[4]:palette[2],900);ctx.font=`700 ${Math.max(18,w/50)}px system-ui`;const lines=wrap(s.text.slice(0,190),w*.68);lines.slice(0,3).forEach((line,i)=>text(line,w*.08,h*.44+i*Math.max(26,w/34),'left'===undefined?20:Math.max(18,w/50),'left','#fff',700));ctx.strokeStyle=s.type==='warning'?palette[4]:palette[2];ctx.lineWidth=7;ctx.beginPath();ctx.arc(w*.82,h*.65,Math.min(w,h)*.09*(1+.06*Math.sin(phase*2)),0,Math.PI*2);ctx.stroke()}
else{const cx=w/2,cy=h*.53,r=Math.min(w,h)*.27,pulse=1+.035*Math.sin(phase*2);box(w*.30,h*.35,w*.40,h*.22,k[0]||s.title,accent,pulse);k.slice(1,5).forEach((v,i)=>{const a=-2.6+i*(5.2/Math.max(1,k.slice(1,5).length-1)),px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r*.7;box(px-w*.09,py-h*.07,w*.18,h*.14,v,palette[(i+1)%5],.68);arrow(px,py,cx+(px<cx?-r*.45:r*.45),cy+(py<cy?-r*.35:r*.35),.75)})}
ctx.font=`700 ${Math.max(15,w/70)}px system-ui`;const lines=wrap(s.text.slice(0,170),w*.82);lines.slice(0,2).forEach((line,i)=>text(line,w/2,h*.84+i*Math.max(22,w/55),'center','#a9bfd0',700));if(style.value==='Minimal motion graphics'){ctx.globalAlpha=.18;ctx.fillStyle=accent;ctx.fillRect(0,h*.93,w,h*.07);ctx.globalAlpha=1}}
function previewRun(){if(recording||!build())return;recording=true;const start=performance.now(),dur=12000;function f(now){const p=Math.min(1,(now-start)/dur),i=Math.min(scenes.length-1,Math.floor(p*scenes.length));draw(scenes[i],now);fill.style.width=(p*100)+'%';status.textContent=`Preview ${Math.floor(p*100)}% • ${scenes[i].type}`;if(p<1)requestAnimationFrame(f);else{recording=false;status.textContent='Preview complete. Generate Video when ready.'}}requestAnimationFrame(f)}
function makeVideo(){if(recording||!build())return;if(!canvas.captureStream||!window.MediaRecorder){status.textContent='Video export is not supported by this browser. Please use a current Chrome or Edge browser.';return}recording=true;generate.disabled=true;preview.disabled=true;watch.hidden=true;download.hidden=true;const stream=canvas.captureStream(12);let mime='';for(const m of ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm']){if(MediaRecorder.isTypeSupported(m)){mime=m;break}}if(!mime){status.textContent='No supported local video format was found.';recording=false;generate.disabled=false;preview.disabled=false;stream.getTracks().forEach(t=>t.stop());return}const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:1800000}),chunks=[],start=performance.now(),dur=+length.value*1000;rec.ondataavailable=e=>e.data&&e.data.size&&chunks.push(e.data);rec.onerror=()=>{recording=false;generate.disabled=false;preview.disabled=false;stream.getTracks().forEach(t=>t.stop());status.textContent='Video recording failed. Please retry.'};rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());recording=false;generate.disabled=false;preview.disabled=false;const blob=new Blob(chunks,{type:mime});if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);video.src=url;watch.hidden=false;download.href=url;download.download='anteneh-ai-studio-video.webm';download.hidden=false;fill.style.width='100%';status.textContent='Video ready — watch it above, then download.'};rec.start(250);function f(now){const p=Math.min(1,(now-start)/dur),i=Math.min(scenes.length-1,Math.floor(p*scenes.length));draw(scenes[i],now);fill.style.width=(p*100)+'%';status.textContent=`Generating video ${Math.floor(p*100)}% • Scene ${i+1}/${scenes.length}`;if(p<1)requestAnimationFrame(f);else setTimeout(()=>rec.stop(),180)}requestAnimationFrame(f)}
generate.onclick=makeVideo;preview.onclick=previewRun;ratio.onchange=()=>topic.value.trim()&&build();style.onchange=()=>topic.value.trim()&&build();mode.onchange=()=>topic.value.trim()&&build();save.onclick=()=>{localStorage.setItem('anteneh-ai-studio-project',JSON.stringify({topic:topic.value,length:length.value,style:style.value,ratio:ratio.value,mode:mode.value}));status.textContent='Project saved on this device.'};restore.onclick=()=>{let p=null;try{p=JSON.parse(localStorage.getItem('anteneh-ai-studio-project')||'null')}catch(e){}if(!p){status.textContent='No saved project found.';return}topic.value=p.topic||'';length.value=p.length||'90';style.value=p.style||'Clean explainer';ratio.value=p.ratio||'16:9';mode.value=p.mode||'Auto';build();status.textContent='Project restored.'};window.addEventListener('beforeunload',()=>url&&URL.revokeObjectURL(url));
})();
</script></body></html>
