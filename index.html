<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANTENEH AI STUDIO</title><style>:root{--bg:#050a12;--panel:#0b1622;--line:#23405a;--text:#eef7ff;--muted:#9eb5c8;--accent:#7657ed;--cyan:#46d9ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui;padding:18px}main{max-width:1000px;margin:auto}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin:15px 0}textarea,select,button{font:inherit}textarea,select{width:100%;background:#07111c;color:#fff;border:1px solid #29435c;border-radius:10px;padding:11px}textarea{min-height:130px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}button{padding:12px 16px;border:0;border-radius:10px;background:#17314a;color:#fff;font-weight:800;cursor:pointer}button.primary{background:var(--accent)}button:disabled{opacity:.5;cursor:wait}canvas{width:100%;height:auto;display:block;background:#02060b;border-radius:14px;margin-top:15px}.status{color:var(--muted);margin-top:10px;font-weight:700}.bar{height:9px;background:#162739;border-radius:8px;margin-top:8px;overflow:hidden}.fill{height:100%;width:0;background:var(--cyan);transition:width .08s}.watch{margin-top:15px;background:#02060b;border-radius:14px;overflow:hidden;border:1px solid #20364a}.watch video{width:100%;display:block;max-height:620px}.watch-title{padding:10px 12px;color:var(--muted);font-weight:700}.scene{margin:10px 0;padding:12px;border:1px solid #20364a;border-radius:12px;background:#07111c}.scene b{color:#62e6ff}.scene small{display:block;color:#7f9aad;margin-top:4px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.pill{border:1px solid #29435c;border-radius:999px;padding:4px 8px;color:#9eb5c8;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}.actions button{width:100%}}</style></head><body><main><h1>✦ ANTENEH AI STUDIO</h1><p>Any subject → visual educational video. Local generation • no API key.</p><section class="panel"><textarea id="topic" placeholder="Enter any topic or full lesson script..."></textarea><div class="grid"><label>Length<select id="length"><option value="60">60 seconds</option><option value="90" selected>90 seconds</option><option value="120">2 minutes</option><option value="300">5 minutes</option></select></label><label>Style<select id="style"><option>Clean explainer</option><option>Whiteboard</option><option>Modern presentation</option><option>Minimal motion graphics</option></select></label><label>Ratio<select id="ratio"><option>16:9</option><option>9:16</option><option>1:1</option><option>4:5</option><option>21:9</option></select></label><label>Visual intelligence<select id="mode"><option>Auto</option><option>Diagram focused</option><option>Process focused</option><option>Presentation focused</option></select></label></div><div class="actions"><button class="primary" id="generate">Generate Video ▶</button><button id="preview">Preview Storyboard</button><button id="save">Save</button><button id="restore">Restore</button></div><div id="status" class="status">Ready.</div><div class="bar"><div id="fill" class="fill"></div></div></section><section class="panel"><canvas id="canvas"></canvas><div id="watch" class="watch" hidden><div class="watch-title">▶ Watch your generated video before downloading</div><video id="video" controls playsinline></video></div><a id="download" hidden style="display:inline-block;margin-top:12px;background:white;color:#06101a;padding:11px 15px;border-radius:9px;font-weight:800">Download video</a><div id="scenes"></div></section></main><script>(()=>{'use strict';const $=id=>document.getElementById(id);const topic=$("topic"),length=$("length"),style=$("style"),ratio=$("ratio"),mode=$("mode"),generate=$("generate"),preview=$("preview"),save=$("save"),restore=$("restore"),status=$("status"),fill=$("fill"),canvas=$("canvas"),sceneBox=$("scenes"),watch=$("watch"),video=$("video"),download=$("download"),ctx=canvas.getContext('2d');let scenes=[],busy=false,url='';const palette=['#4dd7ff','#a78bfa','#62e6a7','#ffcf66','#ff7f9b'];const stop=new Set('a an the and or but for from with into onto about this that these those is are was were be been to of in on at by as it its their they them he she we you your our can could should would will may might do does did how what why when where which who than then also very more most some many much each other another between through during after before because while if so such not no yes have has had'.split(' '));function dims(){const d={'16:9':[1280,720],'9:16':[720,1280],'1:1':[1080,1080],'4:5':[864,1080],'21:9':[1260,540]};return d[ratio.value]||d['16:9']}function words(s){return String(s).replace(/[^A-Za-z0-9%+→=/'’-]+/g,' ').split(/\s+/).filter(w=>w.length>2&&!stop.has(w.toLowerCase())).slice(0,40)}function keys(s){return [...new Set(words(s))].slice(0,7)}function splitLesson(s){const lines=String(s).trim().split(/\r?\n/).flatMap(line=>line.split(/[.!?]+\s*/)).map(x=>x.trim()).filter(Boolean);if(lines.length>=3)return lines;const b=String(s).trim().replace(/[.!?]+$/,'');return[b,`How ${b} works`, `The main parts of ${b}`,`Why ${b} matters`,`An example of ${b}`,`Key takeaway: ${b}`]}function classify(s,i,n){const q=s.toLowerCase();if(/[=→+%]/.test(s)||/formula|equation|calculate|equals|reaction/.test(q))return'formula';if(/compare|versus|\bvs\b|difference|similar|unlike|both|whereas/.test(q))return'comparison';if(/first|then|next|finally|step|process|procedure|cycle|how .*\bwork\b/.test(q))return'process';if(/cause|because|therefore|leads to|results? in|effect|why /.test(q))return'cause';if(/example|for instance|such as|e\.g\./.test(q))return'example';if(/warning|avoid|mistake|misconception|danger|careful|risk/.test(q))return'warning';if(/timeline|history|year|century|before|after|era|founded|born/.test(q))return'timeline';if(/if |unless|decision|choose|depends|yes|no/.test(q))return'decision';return i===n-1?'recap':i===0?'concept':'concept'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function build(){const raw=topic.value.trim();if(!raw){status.textContent='Please enter a topic or script.';return false}const max=+length.value<=60?6:+length.value<=90?7:+length.value<=120?8:12;const parts=splitLesson(raw).slice(0,max),d=dims();scenes=parts.map((text,i)=>{const k=keys(text);return{id:i,text,title:i===0?raw.length<55?raw:(k[0]||'Lesson introduction'):i===parts.length-1?'Key takeaway':(k[0]||`Key idea ${i+1}`),type:classify(text,i,parts.length),keys:k}});canvas.width=d[0];canvas.height=d[1];sceneBox.innerHTML=scenes.map((s,i)=>`<div class="scene"><b>${i+1}. ${esc(s.title)}</b><small>${s.type} — ${esc(s.text)}</small><div class="meta">${s.keys.slice(0,5).map(k=>`<span class="pill">${esc(k)}</span>`).join('')}</div></div>`).join('');draw(scenes[0],0);return true}function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}function text(t,x,y,size,align='left',color='#fff',weight=800){ctx.fillStyle=color;ctx.font=`${weight} ${size}px system-ui`;ctx.textAlign=align;ctx.fillText(String(t),x,y);ctx.textAlign='left'}function bg(w,h){ctx.fillStyle='#06111c';ctx.fillRect(0,0,w,h);const g=ctx.createRadialGradient(w*.72,h*.18,0,w*.72,h*.18,Math.max(w,h)*.75);g.addColorStop(0,'#12334d');g.addColorStop(1,'#06111c');ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}function box(x,y,w,h,label,color,scale=1){ctx.fillStyle='rgba(8,24,38,.96)';ctx.strokeStyle=color;ctx.lineWidth=3;rr(x,y,w,h,18);ctx.fill();ctx.stroke();const fs=Math.max(15,Math.min(42,w/Math.max(5,label.length/2.5)))*scale;text(label,x+w/2,y+h/2+fs*.35,fs,'center')}function arrow(x1,y1,x2,y2){ctx.strokeStyle='#fff';ctx.fillStyle='#fff';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();const a=Math.atan2(y2-y1,x2-x1);ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-18*Math.cos(a-.55),y2-18*Math.sin(a-.55));ctx.lineTo(x2-18*Math.cos(a+.55),y2-18*Math.sin(a+.55));ctx.fill()}function wrap(s,max){const out=[];let line='';String(s).split(/\s+/).forEach(w=>{const n=(line+' '+w).trim();if(n.length>max){if(line)out.push(line);line=w}else line=n});if(line)out.push(line);return out.slice(0,4)}function caption(s,w,h){wrap(s.text,72).forEach((v,i)=>text(v,w/2,h*.78+i*Math.max(20,w/85),Math.max(14,w/75),'center','#b7cad7',650))}function draw(s,t){if(!s)return;const w=canvas.width,h=canvas.height;bg(w,h);const accent=palette[s.id%palette.length],k=s.keys.length?s.keys:[s.title];text(s.title,w*.06,h*.105,Math.max(24,w/31),'left','#62e6ff',900);text(`${s.type.toUpperCase()} • SCENE ${s.id+1}`,w*.06,h*.155,Math.max(12,w/90),'left','#91aabd',700);let type=s.type;if(mode.value==='Process focused'&&type==='concept')type='process';if(mode.value==='Diagram focused'&&type==='concept')type='diagram';if(type==='process'||type==='formula'){const a=Math.min(k.length,5),gap=w*.025,b=(w*.82-gap*(a-1))/a,y=h*.38;k.slice(0,a).forEach((v,i)=>{const x=w*.09+i*(b+gap),yy=y+Math.sin(t/280+i)*8;box(x,yy,b,h*.21,v,palette[i%5]);if(i<a-1)arrow(x+b+4,yy+h*.105,x+b+gap-4,y+h*.105)})}else if(type==='comparison'){box(w*.07,h*.35,w*.36,h*.28,k[0]||'A',palette[0]);text('VS',w*.5,h*.50,Math.max(22,w/45),'center');box(w*.57,h*.35,w*.36,h*.28,k[1]||'B',palette[1])}else if(type==='cause'){box(w*.07,h*.36,w*.30,h*.25,k[0]||'Cause',palette[0]);arrow(w*.39,h*.485,w*.60,h*.485);box(w*.61,h*.36,w*.32,h*.25,k[1]||'Effect',palette[1])}else if(type==='timeline'){const y=h*.50,x0=w*.10,x1=w*.90;ctx.strokeStyle=accent;ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke();k.slice(0,6).forEach((v,i)=>{const x=x0+(x1-x0)*(i/Math.max(1,Math.min(k.length,6)-1));ctx.fillStyle=palette[i%5];ctx.beginPath();ctx.arc(x,y,13+5*Math.sin(t/250+i),0,Math.PI*2);ctx.fill();box(Math.max(4,x-w*.08),y-h*.25,w*.16,h*.15,v,palette[i%5],.8)})}else if(type==='decision'){box(w*.30,h*.34,w*.40,h*.20,k[0]||'Decision',accent);arrow(w*.50,h*.54,w*.28,h*.67);arrow(w*.50,h*.54,w*.72,h*.67);text('YES',w*.25,h*.65,16,'center','#62e6a7');text('NO',w*.75,h*.65,16,'center','#ff7f9b');box(w*.10,h*.68,w*.30,h*.15,k[1]||'Path A',palette[2],.8);box(w*.60,h*.68,w*.30,h*.15,k[2]||'Path B',palette[4],.8)}else if(type==='warning'||type==='example'){text(type==='warning'?'WATCH FOR THIS':'REAL EXAMPLE',w*.08,h*.30,Math.max(20,w/48),'left',type==='warning'?palette[4]:palette[2],900);wrap(s.text,42).forEach((v,i)=>text(v,w*.08,h*.43+i*Math.max(24,w/65),Math.max(18,w/55),'left'));ctx.strokeStyle=type==='warning'?palette[4]:palette[2];ctx.lineWidth=7;ctx.beginPath();ctx.arc(w*.82,h*.58,Math.min(w,h)*(.09+.015*Math.sin(t/220)),0,Math.PI*2);ctx.stroke()}else{const cx=w/2,cy=h*.49,r=Math.min(w,h)*.27;box(w*.31,h*.34,w*.38,h*.20,k[0]||s.title,accent);k.slice(1,5).forEach((v,i)=>{const a=-2.6+i*(5.2/Math.max(1,k.slice(1,5).length-1)),px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r*.7;box(px-w*.09,py-h*.07,w*.18,h*.14,v,palette[(i+1)%5],.75);arrow(px,py,cx+(px<cx?-r*.45:r*.45),cy+(py<cy?-r*.35:r*.35))})}caption(s,w,h);if(style.value==='Whiteboard'){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.globalAlpha=.18;for(let y=h*.18;y<h*.9;y+=38){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.globalAlpha=1}}function previewRun(){if(busy||!build())return;busy=true;const start=performance.now(),dur=12000;function frame(now){const p=Math.min(1,(now-start)/dur),i=Math.min(scenes.length-1,Math.floor(p*scenes.length));draw(scenes[i],now);fill.style.width=`${p*100}%`;status.textContent=`Preview ${Math.floor(p*100)}%`;if(p<1)requestAnimationFrame(frame);else{busy=false;status.textContent='Preview complete.'}}requestAnimationFrame(frame)}function generateRun(){if(busy||!build())return;if(typeof canvas.captureStream!=='function'||typeof MediaRecorder==='undefined'){status.textContent='Video export needs a modern Chrome, Edge, or Firefox browser.';return}busy=true;watch.hidden=true;download.hidden=true;const stream=canvas.captureStream(12);let mime='';for(const m of ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm']){if(typeof MediaRecorder.isTypeSupported!=='function'||MediaRecorder.isTypeSupported(m)){mime=m;break}}if(!mime){stream.getTracks().forEach(t=>t.stop());busy=false;status.textContent='This browser cannot create a WebM video.';return}let rec;try{rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:1800000})}catch(e){stream.getTracks().forEach(t=>t.stop());busy=false;status.textContent='Video recorder could not start.';return}const chunks=[],start=performance.now(),dur=Math.max(1000,+length.value*1000);rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};rec.onerror=()=>{busy=false;stream.getTracks().forEach(t=>t.stop());status.textContent='Video recording failed. Please try again.'};rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());busy=false;const blob=new Blob(chunks,{type:mime});if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);video.src=url;watch.hidden=false;download.href=url;download.download='anteneh-ai-studio-video.webm';download.hidden=false;fill.style.width='100%';status.textContent='Video ready — watch it above, then download.'};try{rec.start(250)}catch(e){stream.getTracks().forEach(t=>t.stop());busy=false;status.textContent='Unable to start video recording.';return}function frame(now){const p=Math.min(1,(now-start)/dur),i=Math.min(scenes.length-1,Math.floor(p*scenes.length));draw(scenes[i],now);fill.style.width=`${p*100}%`;status.textContent=`Generating video ${Math.floor(p*100)}%`;if(p<1)requestAnimationFrame(frame);else setTimeout(()=>{if(rec.state!=='inactive')rec.stop()},250)}requestAnimationFrame(frame)}generate.onclick=generateRun;preview.onclick=previewRun;ratio.onchange=()=>{if(topic.value.trim())build()};style.onchange=()=>{if(topic.value.trim())build()};mode.onchange=()=>{if(topic.value.trim())build()};save.onclick=()=>{localStorage.setItem('anteneh-ai-studio-project',JSON.stringify({topic:topic.value,length:length.value,style:style.value,ratio:ratio.value,mode:mode.value}));status.textContent='Project saved on this device.'};restore.onclick=()=>{let p=null;try{p=JSON.parse(localStorage.getItem('anteneh-ai-studio-project')||'null')}catch(e){}if(!p){status.textContent='No saved project found.';return}topic.value=p.topic||'';length.value=p.length||'90';style.value=p.style||'Clean explainer';ratio.value=p.ratio||'16:9';mode.value=p.mode||'Auto';if(build())status.textContent='Project restored.'};window.addEventListener('beforeunload',()=>{if(url)URL.revokeObjectURL(url)});})();</script></body></html>
