<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>ANTENEH AI STUDIO</title><style>body{margin:0;background:#07111f;color:#f5f8ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1200px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.08em}.status{color:#59e6a5;font-size:12px}.grid{display:grid;grid-template-columns:360px 1fr;gap:16px;margin-top:20px}.card{background:#0c1827;border:1px solid #243c55;border-radius:20px;padding:18px}.hero h1{font-size:clamp(34px,6vw,68px);line-height:1;margin:30px 0 10px}.muted{color:#91a6bc;line-height:1.6}.label{display:block;font-size:11px;font-weight:800;color:#cbd9e8;margin:12px 0 7px}textarea,select{width:100%;box-sizing:border-box;background:#07111d;color:#fff;border:1px solid #29435e;border-radius:12px;padding:12px;font:inherit}textarea{min-height:180px;resize:vertical}.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.btn{border:1px solid #2a435e;background:#112238;color:#fff;border-radius:11px;padding:12px;font-weight:800}.primary{border:0;background:linear-gradient(135deg,#8b5cf6,#3c9cff)}.wide{grid-column:1/-1}.progress{height:7px;background:#17283a;border-radius:99px;margin-top:13px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#8b5cf6,#38d9f5);transition:.15s}.msg{font-size:12px;color:#91a6bc;min-height:18px;margin-top:8px}.stage{background:#02070d;border:1px solid #29415a;border-radius:16px;padding:10px}.stage canvas{width:100%;height:auto;display:block;border-radius:10px}.timeline{display:flex;gap:7px;overflow:auto;margin-top:12px}.thumb{min-width:100px;background:#091522;color:#fff;border:1px solid #29435e;border-radius:10px;padding:9px;text-align:left}.thumb.active{border-color:#38d9f5}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.tag{font-size:10px;padding:6px 9px;border:1px solid #29435e;border-radius:99px;color:#a9bfd4}.export{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.download{display:none;background:#fff;color:#07111f;text-decoration:none;padding:11px;border-radius:10px;font-weight:900}.download.show{display:inline-block}@media(max-width:850px){.grid{grid-template-columns:1fr}}@media(max-width:520px){.fields,.buttons{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><div class="wrap"><div class="top"><div class="brand">ANTENEH AI STUDIO</div><div class="status">● Browser engine ready</div></div><section class="hero"><h1>Turn your idea into an educational video.</h1><p class="muted">Topic → automatic lesson → visual scenes → captions → animation → browser video.</p></section><div class="grid"><section class="card"><h3>01 · Create</h3><label class="label">TOPIC OR SCRIPT</label><textarea id="topic" placeholder="Example: Why discipline matters in life"></textarea><div class="fields"><div><label class="label">STYLE</label><select id="style"><option>Explainer</option><option>Whiteboard</option><option>Presentation</option></select></div><div><label class="label">LANGUAGE</label><select id="lang"><option value="en-US">English</option><option value="am-ET">አማርኛ</option></select></div><div><label class="label">RATIO</label><select id="ratio"><option>16:9</option><option>9:16</option><option>1:1</option><option>4:5</option></select></div><div><label class="label">LENGTH</label><select id="length"><option>30</option><option selected>60</option><option>90</option><option>120</option><option>300</option></select></div></div><div class="buttons"><button class="btn primary" id="generate">Generate lesson ▶</button><button class="btn" id="story">Build storyboard</button><button class="btn" id="voice">🔊 Read scene</button><button class="btn" id="captions">CC Captions: ON</button><button class="btn wide" id="save">Save project</button></div><div class="progress"><div class="fill" id="fill"></div></div><div class="msg" id="msg">Ready.</div></section><section class="card"><h3>02 · Preview & render</h3><div class="stage"><canvas id="canvas" width="1280" height="720"></canvas></div><div class="timeline" id="timeline"></div><div class="meta" id="meta"></div><div class="export"><button class="btn primary" id="record">● Render video</button><button class="btn" id="stop" disabled>Stop</button><a id="download" class="download">Download WebM</a></div></section></div></div><script>
(function(){'use strict';
const $=id=>document.getElementById(id);const topic=$("topic"),style=$("style"),lang=$("lang"),ratio=$("ratio"),length=$("length"),canvas=$("canvas"),ctx=canvas.getContext("2d"),fill=$("fill"),msg=$("msg"),timeline=$("timeline"),meta=$("meta"),generate=$("generate"),record=$("record"),stop=$("stop"),download=$("download");let scenes=[],active=0,captionOn=true,animationId=0,rec=null,chunks=[],url='';
function clean(s){return String(s||'').replace(/\s+/g,' ').trim()}function size(){return {'16:9':[1280,720],'9:16':[720,1280],'1:1':[1080,1080],'4:5':[864,1080]}[ratio.value]||[1280,720]}
function parts(s){let p=clean(s).split(/(?<=[.!?])\s+|\n+/).filter(Boolean);if(p.length<4){let b=clean(s);p=['What is '+b+'?','Why does '+b+' matter?','Here is how '+b+' works in simple terms.','A practical example helps us understand '+b+'.','The key takeaway is why '+b+' matters.']}return p.slice(0,8)}
function type(t,i,n){let q=t.toLowerCase();if(/first|then|next|finally|step|process|works/.test(q))return'Process';if(/compare|versus|difference|both/.test(q))return'Comparison';if(/because|cause|effect|leads|results|impact/.test(q))return'Cause & effect';if(/year|history|timeline/.test(q))return'Timeline';if(/cycle|repeat|loop/.test(q))return'Cycle';return i===0?'Concept':i===n-1?'Recap':'Idea'}
function build(){let raw=clean(topic.value);if(!raw){msg.textContent='Enter a topic or script first.';topic.focus();return false}let p=parts(raw);scenes=p.map((t,i)=>({title:i===0?'The big question':i===p.length-1?'Key takeaway':'Key idea '+(i+1),text:t,type:type(t,i,p.length)}));let s=size();canvas.width=s[0];canvas.height=s[1];active=0;timeline.innerHTML='';scenes.forEach((x,i)=>{let b=document.createElement('button');b.className='thumb'+(i===0?' active':'');b.innerHTML='<b>Scene '+(i+1)+'</b><br><small>'+x.type+'</small>';b.onclick=()=>{active=i;draw(i,0);refreshTimeline()};timeline.appendChild(b)});meta.innerHTML='';[style.value,lang.options[lang.selectedIndex].text,ratio.value,length.value+' sec'].forEach(v=>{let d=document.createElement('span');d.className='tag';d.textContent=v;meta.appendChild(d)});draw(0,0);return true}
function refreshTimeline(){[...timeline.children].forEach((b,i)=>b.classList.toggle('active',i===active))}
function background(){let w=canvas.width,h=canvas.height,g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'#0b2033');g.addColorStop(1,'#02060b');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.strokeStyle='#ffffff0b';for(let x=0;x<w;x+=Math.max(70,w/14)){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=Math.max(70,h/10)){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}}
function wrap(t,max){let a=[],line='';clean(t).split(' ').forEach(w=>{let n=line?line+' '+w:w;if(ctx.measureText(n).width>max&&line){a.push(line);line=w}else line=n});if(line)a.push(line);return a.slice(0,5)}
function txt(t,x,y,sz,max,weight=700,align='left'){ctx.font=weight+' '+sz+'px system-ui';ctx.fillStyle='#f7fbff';ctx.textAlign=align;wrap(t,max).forEach((v,i)=>ctx.fillText(v,x,y+i*sz*1.25));ctx.textAlign='left'}
function draw(i,p=0){background();if(!scenes.length){txt('ANTENEH AI STUDIO',canvas.width/2,canvas.height/2,Math.max(25,canvas.width/18),canvas.width*.8,900,'center');return}let s=scenes[i],w=canvas.width,h=canvas.height,c=['#38d9f5','#8b5cf6','#59e6a5','#ffd166','#ff718e'][i%5];ctx.fillStyle=c;ctx.globalAlpha=.18;ctx.beginPath();ctx.arc(w*.78,h*.25,Math.min(w,h)*(.15+.03*Math.sin(p*6.28)),0,7);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle=c;ctx.fillRect(w*.08,h*.14,Math.min(150,w*.2),5);txt(s.title,w*.08,h*.27,Math.max(22,w/25),w*.78,900);txt(s.text,w*.08,h*.42,Math.max(17,w/35),w*.78,600);txt(s.type+'  ·  Scene '+(i+1)+' / '+scenes.length+'  ·  '+style.value,w*.08,h*.76,Math.max(12,w/65),w*.8,800);if(captionOn){ctx.fillStyle='#000b';ctx.fillRect(w*.05,h*.87,w*.9,Math.min(75,h*.1));txt(s.text,w*.5,h*.87+Math.min(32,h*.045),Math.max(12,w/65),w*.82,750,'center')}}
function preview(){cancelAnimationFrame(animationId);let start=performance.now(),per=1800,total=scenes.length*per;function loop(now){let e=(now-start)%total;active=Math.floor(e/per);draw(active,(e%per)/per);refreshTimeline();animationId=requestAnimationFrame(loop)}animationId=requestAnimationFrame(loop)}
function generateLesson(){if(!build())return;generate.disabled=true;let steps=[['Reading topic…',20],['Building lesson…',40],['Creating scenes…',65],['Preparing captions…',82],['Starting preview…',100]],i=0;let timer=setInterval(()=>{msg.textContent=steps[i][0];fill.style.width=steps[i][1]+'%';i++;if(i===steps.length){clearInterval(timer);generate.disabled=false;msg.textContent='Lesson ready — '+scenes.length+' scenes.';preview()}},220)}
function speak(){if(!scenes.length){msg.textContent='Generate a lesson first.';return}if(!('speechSynthesis' in window)){msg.textContent='Speech is not supported here.';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(scenes[active].text);u.lang=lang.value;u.rate=.9;speechSynthesis.speak(u);msg.textContent='Reading scene '+(active+1)+'…'}
function render(){if(!scenes.length){msg.textContent='Generate a lesson first.';return}if(!canvas.captureStream||!window.MediaRecorder){msg.textContent='Browser video recording is not supported.';return}cancelAnimationFrame(animationId);chunks=[];let stream=canvas.captureStream(30);try{rec=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9'})}catch(e){rec=new MediaRecorder(stream)}rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{let blob=new Blob(chunks,{type:'video/webm'});if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);download.href=url;download.download='anteneh-ai-studio.webm';download.classList.add('show');record.disabled=false;stop.disabled=true;msg.textContent='Video ready. Tap Download WebM.'};rec.start(200);record.disabled=true;stop.disabled=false;msg.textContent='Rendering video…';let start=performance.now(),per=1300;function loop(now){if(!rec||rec.state==='inactive')return;let e=now-start,i=Math.floor(e/per);if(i>=scenes.length){draw(scenes.length-1,1);rec.stop();return}active=i;draw(i,(e%per)/per);refreshTimeline();animationId=requestAnimationFrame(loop)}animationId=requestAnimationFrame(loop)}
generate.onclick=generateLesson;$("story").onclick=()=>{if(build())msg.textContent='Storyboard ready.'};$("voice").onclick=speak;$("captions").onclick=()=>{captionOn=!captionOn;$("captions").textContent='CC Captions: '+(captionOn?'ON':'OFF');if(scenes.length)draw(active)};$("save").onclick=()=>{localStorage.setItem('anteneh_project',JSON.stringify({topic:topic.value,style:style.value,lang:lang.value,ratio:ratio.value,length:length.value}));msg.textContent='Project saved.'};record.onclick=render;stop.onclick=()=>{if(rec&&rec.state!=='inactive')rec.stop();cancelAnimationFrame(animationId)};ratio.onchange=()=>{if(scenes.length)build()};style.onchange=()=>{if(scenes.length)build()};draw(0,0);
})();</script></body></html>
